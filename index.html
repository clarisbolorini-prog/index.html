<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Custos RNS</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Dependências do Recharts -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-is@18.2.0/umd/react-is.production.min.js"></script>
    
    <!-- Babel (Versão estável 7.12.12 para evitar conflito de importSource no tempo de execução clássico) -->
    <script src="https://unpkg.com/@babel/standalone@7.12.12/babel.min.js"></script>
    
    <!-- Recharts (Gráficos) -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <style>
        body { 
            background-color: #020617; 
            color: #f8fafc; 
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; 
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d97706; border-radius: 4px; }
        
        /* Remove o ícone de seta do datalist em alguns navegadores para ficar mais limpo */
        input::-webkit-calendar-picker-indicator {
            display: none !important;
        }
    </style>
    
    <script>
        // Sobrescrita segura do alert para evitar congelamento/bloqueio no iframe de preview
        window.alert = function(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-5 right-5 bg-red-600/90 text-white px-6 py-4 rounded-2xl shadow-2xl z-[9999] font-sans font-bold text-sm border border-red-500/30 backdrop-blur-sm transition-all duration-300';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        };
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        /** @jsxRuntime classic */
        const { useState, useMemo, useEffect } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Cell, LabelList, ComposedChart, Line, Legend, PieChart, Pie } = window.Recharts;

        // Ícones em SVG nativo para compatibilidade total e sem dependências externas
        const AlertTriangle = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>;
        const Filter = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>;
        const Award = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>;
        const LayoutDashboard = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>;
        const UploadIcon = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>;
        const ClipboardList = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>;
        const BarChart3 = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>;
        const LineChartIcon = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>;
        const CalendarIcon = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>;
        const SearchIcon = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
        const LinkIcon = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>;
        const ChevronDown = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 12 15 18 9"/></svg>;
        const PieChartIcon = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>;
        const Truck = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="1" y="3" width="15" height="13" rx="2" ry="2" /><polygon points="16 8 20 8 23 11 23 16 16 16 16 8" /><circle cx="5.5" cy="18.5" r="2.5" /><circle cx="18.5" cy="18.5" r="2.5" /></svg>;

        const TAX_RATE = 0.20;
        const CRITICAL_MARGIN_THRESHOLD = 0.16; // Margem operacional de alerta ajustada para 16%

        const App = () => {
          const [data, setData] = useState([]);
          const [atendimentosData, setAtendimentosData] = useState([]);
          const [reboqueData, setReboqueData] = useState([]); // Base financeira consolidada de reboques
          const [atendimentosReboqueData, setAtendimentosReboqueData] = useState([]); // Base granular de atendimentos de reboque
          const [activeTab, setActiveTab] = useState('geral');
          const [reboqueSubTab, setReboqueSubTab] = useState('geral'); // Subtabs internas de reboque
          const [selectedClient, setSelectedClient] = useState('');
          const [selectedMonth, setSelectedMonth] = useState('Todos');
          const [isLoaded, setIsLoaded] = useState(false);
          const [sheetUrl, setSheetUrl] = useState('');
          const [isLoadingUrl, setIsLoadingUrl] = useState(false);
          const [isClientListOpen, setIsClientListOpen] = useState(false);
          const [criticalSearch, setCriticalSearch] = useState(''); // Busca na auditoria de reboques

          // Controle de visualização de blocos expansíveis (Acordeons)
          const [showCruzamento, setShowCruzamento] = useState(false);
          const [showFaturamento, setShowFaturamento] = useState(false);
          const [showBaseAtiva, setShowBaseAtiva] = useState(false);

          // Função de parsing financeiro robusta e segura contra erros de formato regional ou float bruto
          const parseCurrency = (value) => {
            if (value === undefined || value === null) return 0;
            if (typeof value === 'number') return value;
            let valStr = String(value).replace('R$', '').trim();
            
            if (valStr.includes(',') && valStr.includes('.')) {
              valStr = valStr.replace(/\./g, '').replace(',', '.');
            } else if (valStr.includes(',')) {
              valStr = valStr.replace(',', '.');
            }
            
            const num = parseFloat(valStr);
            return isNaN(num) ? 0 : num;
          };

          // Extrator de meses adaptativo reconstruído para evitar conversões indesejadas de números de série do Excel
          const getMonthName = (val) => {
              if (val === undefined || val === null || val === '') return "TODOS";
              const MONTHS = ["JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO", "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"];

              if (val instanceof Date) {
                  return MONTHS[val.getMonth()];
              }
              
              // Se for um número (ou uma string representando o serial de data do Excel)
              const numVal = Number(val);
              if (!isNaN(numVal) && numVal > 10000 && numVal < 100000) {
                  const date = new Date(Math.round((numVal - 25569) * 86400 * 1000));
                  return MONTHS[date.getUTCMonth()];
              }

              if (typeof val === 'string') {
                  const trimmed = val.trim();
                  if (trimmed.toUpperCase() === 'DATA' || trimmed.toUpperCase().includes('EXECUÇÃO') || trimmed.toUpperCase().includes('EXECUCAO')) return 'TODOS';
                  
                  // Verifica se a string já contém o nome do mês por extenso
                  for (let m of MONTHS) {
                      if (trimmed.toUpperCase().includes(m)) return m;
                  }
                  
                  // Se for numérico (ISO ou data formatada), divide pelos separadores de data
                  const parts = trimmed.split(/\D+/).filter(Boolean);
                  if (parts.length >= 2) {
                      if (parts[0].length === 4) { // Formato YYYY-MM-DD
                          const m = parseInt(parts[1], 10);
                          if (m >= 1 && m <= 12) return MONTHS[m - 1];
                      } else if (parts[2] && parts[2].length === 4) { // Formato DD/MM/YYYY
                          const m = parseInt(parts[1], 10);
                          if (m >= 1 && m <= 12) return MONTHS[m - 1];
                      } else { // Fallback para formatos sem ano com 4 dígitos
                          const m = parseInt(parts[1], 10);
                          if (m >= 1 && m <= 12) return MONTHS[m - 1];
                      }
                  }
              }
              return "TODOS";
          };

          const processWorkbook = (workbook) => {
            try {
                const result = [];
                const atendimentosResult = [];
                const reboqueResult = [];
                const atendimentosReboqueResult = [];

                workbook.SheetNames.forEach(mesName => {
                  const sheet = workbook.Sheets[mesName];
                  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                  const sheetKey = mesName.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_').trim();

                  // Tratamento da aba de ATENDIMENTOS (Geral)
                  if (sheetKey === 'ATENDIMENTOS') {
                      if (rows.length < 2) return;
                      const headers = rows[0].map(h => h ? String(h).toLowerCase().trim() : '');
                      
                      const idxApoio = headers.findIndex(h => h.includes('apoio') || h.includes('nome'));
                      const idxStatus = headers.findIndex(h => h.includes('status') || h.includes('recuperado') || h.includes('recuperação') || h.includes('resultado'));
                      const idxRegiao = headers.findIndex(h => h.includes('estado') || h.includes('uf') || h.includes('região') || h.includes('regiao'));
                      
                      const idxCliente = 4;
                      const idxData = 25;

                      for (let i = 1; i < rows.length; i++) {
                          const row = rows[i];
                          if (!row || row.length === 0) continue;
                          
                          const apoio = idxApoio !== -1 && row[idxApoio] ? String(row[idxApoio]).trim() : "Não Informado";
                          const status = idxStatus !== -1 && row[idxStatus] ? String(row[idxStatus]).trim() : "Indefinido";
                          const regiao = idxRegiao !== -1 && row[idxRegiao] ? String(row[idxRegiao]).trim().toUpperCase() : "NI";
                          
                          const cliente = row[idxCliente] ? String(row[idxCliente]).trim() : "Não Informado";
                          const rawDate = row[idxData];
                          
                          const mesFormatado = rawDate ? getMonthName(rawDate) : "TODOS";
                          
                          let dataExata = null;
                          if (typeof rawDate === 'number') {
                              dataExata = new Date(Math.round((rawDate - 25569) * 86400 * 1000));
                          } else if (typeof rawDate === 'string') {
                              const parts = rawDate.split(/[-/]/);
                              if (parts.length >= 3) {
                                  const isYearFirst = parts[0].length === 4;
                                  const d = isYearFirst ? parseInt(parts[2], 10) : parseInt(parts[0], 10);
                                  const m = isYearFirst ? parseInt(parts[1], 10) - 1 : parseInt(parts[1], 10) - 1;
                                  const y = isYearFirst ? parseInt(parts[0], 10) : (parts[2].length === 2 ? 2000 + parseInt(parts[2], 10) : parseInt(parts[2], 10));
                                  dataExata = new Date(y, m, d);
                              }
                          }
                          if (dataExata && isNaN(dataExata.getTime())) dataExata = null;

                          if (apoio !== "Não Informado" || status !== "Indefinido") {
                              atendimentosResult.push({ apoio, status, regiao, mes: mesFormatado, cliente, dataExata });
                          }
                      }
                      return; 
                  }

                  // Tratamento da NOVA ABA de "Atendimentos de reboque" / "Atendimentos de reboques"
                  if (sheetKey.includes('ATENDIMENTOS_DE_REBOQUE') || sheetKey.includes('ATENDIMENTOS_DE_REBOQUES') || sheetKey.includes('ATENDIMENTOS_REBOQUE')) {
                      if (rows.length < 2) return;
                      
                      let headerRowIdx = -1;
                      for (let r = 0; r < Math.min(10, rows.length); r++) {
                          if (rows[r]) {
                              const rowLower = rows[r].map(cell => cell ? String(cell).toLowerCase().trim() : '');
                              if (rowLower.includes('data execucao servico') || rowLower.includes('data execução serviço') || rowLower.includes('prestador') || rowLower.includes('placa')) {
                                  headerRowIdx = r;
                                  break;
                              }
                          }
                      }
                      
                      if (headerRowIdx === -1) headerRowIdx = 0;
                      
                      const headers = rows[headerRowIdx].map(h => h ? String(h).toLowerCase().trim() : '');
                      
                      const idxData = headers.findIndex(h => h.includes('data execucao') || h.includes('data execução') || h === 'data');
                      const idxCliente = headers.findIndex(h => h.includes('beneficiario') || h.includes('beneficiário') || h === 'cliente');
                      const idxPlaca = headers.indexOf('placa');
                      const idxPrestador = headers.findIndex(h => h === 'prestador' || h === 'guincheiro');
                      const idxUF = headers.findIndex(h => h === 'uf origem' || h === 'estado' || h === 'uf');
                      
                      const colData = idxData !== -1 ? idxData : 0;
                      const colCliente = idxCliente !== -1 ? idxCliente : 1;
                      const colPlaca = idxPlaca !== -1 ? idxPlaca : 2;
                      const colPrestador = idxPrestador !== -1 ? idxPrestador : 7;
                      const colUF = idxUF !== -1 ? idxUF : 29;

                      for (let i = headerRowIdx + 1; i < rows.length; i++) {
                          const row = rows[i];
                          if (!row || row.length < 3) continue;
                          
                          const rawData = row[colData];
                          const cliente = row[colCliente] ? String(row[colCliente]).trim() : '';
                          const prestador = row[colPrestador] ? String(row[colPrestador]).trim() : '';
                          const estado = row[colUF] ? String(row[colUF]).trim().toUpperCase() : 'N/A';
                          const placa = row[colPlaca] ? String(row[colPlaca]).trim() : '';
                          
                          if (!cliente && !prestador && !placa) continue;
                          if (cliente.toLowerCase() === 'nome do beneficiário' || prestador.toLowerCase() === 'prestador') continue;
                          
                          const mes = getMonthName(rawData);
                          
                          let dataStr = '';
                          if (rawData instanceof Date) {
                              dataStr = rawData.toLocaleDateString('pt-BR');
                          } else if (typeof rawData === 'number') {
                              const dObj = new Date(Math.round((rawData - 25569) * 86400 * 1000));
                              dataStr = dObj.toLocaleDateString('pt-BR');
                          } else {
                              const strVal = String(rawData).trim();
                              const parts = strVal.split(/\D+/).filter(Boolean);
                              if (parts.length >= 3 && parts[0].length === 4) {
                                  dataStr = `${parts[2]}/${parts[1]}/${parts[0]}`;
                              } else {
                                  dataStr = strVal;
                              }
                          }

                          atendimentosReboqueResult.push({
                              dataStr,
                              mes,
                              cliente,
                              prestador,
                              estado,
                              placa
                          });
                      }
                      return;
                  }

                  // Tratamento da aba consolidada de REBOQUE (Dados Financeiros por Placa)
                  if (sheetKey === 'REBOQUE') {
                      if (rows.length < 2) return;
                      let headerRowIdx = -1;
                      for (let r = 0; r < Math.min(10, rows.length); r++) {
                          if (rows[r]) {
                              const rowLower = rows[r].map(cell => cell ? String(cell).toLowerCase().trim() : '');
                              if (rowLower.includes('data') && rowLower.includes('guincheiro') && rowLower.includes('placa')) {
                                  headerRowIdx = r;
                                  break;
                              }
                          }
                      }
                      
                      if (headerRowIdx === -1) {
                          for (let r = 0; r < Math.min(10, rows.length); r++) {
                              if (rows[r]) {
                                  const rowLower = rows[r].map(cell => cell ? String(cell).toLowerCase().trim() : '');
                                  if (rowLower.includes('guincheiro') || rowLower.includes('placa') || rowLower.includes('data')) {
                                      headerRowIdx = r;
                                      break;
                                  }
                              }
                          }
                      }
                      
                      if (headerRowIdx === -1) headerRowIdx = 1; // Fallback estrutural
                      
                      const headers = rows[headerRowIdx].map(h => h ? String(h).toLowerCase().trim() : '');
                      
                      const idxData = headers.indexOf('data');
                      const idxCliente = headers.indexOf('cliente');
                      const idxGuincheiro = headers.indexOf('guincheiro');
                      const idxEstado = headers.findIndex(h => h.includes('estado') || h.includes('uf') || h.includes('região') || h.includes('regiao'));
                      const idxPlaca = headers.indexOf('placa');
                      
                      let idxValGuincheiro = -1;
                      let idxValCliente = -1;
                      
                      headers.forEach((h, index) => {
                          if (h.includes('valor') || h.includes('total')) {
                              if (idxValGuincheiro === -1) {
                                  idxValGuincheiro = index;
                              } else {
                                  idxValCliente = index;
                              }
                          }
                      });
                      
                      const colData = idxData !== -1 ? idxData : 0;
                      const colCliente = idxCliente !== -1 ? idxCliente : 1;
                      const colGuincheiro = idxGuincheiro !== -1 ? idxGuincheiro : 2;
                      const colEstado = idxEstado !== -1 ? idxEstado : 3;
                      const colPlaca = idxPlaca !== -1 ? idxPlaca : 4;
                      const colValGuincheiro = idxValGuincheiro !== -1 ? idxValGuincheiro : 5;
                      const colValCliente = idxValCliente !== -1 ? idxValCliente : 6;

                      for (let i = headerRowIdx + 1; i < rows.length; i++) {
                          const row = rows[i];
                          if (!row || row.length < 4) continue;
                          
                          const rawData = row[colData];
                          const cliente = row[colCliente] ? String(row[colCliente]).trim() : '';
                          const guincheiro = row[colGuincheiro] ? String(row[colGuincheiro]).trim() : '';
                          const estado = row[colEstado] ? String(row[colEstado]).trim().toUpperCase() : 'N/A';
                          const placa = row[colPlaca] ? String(row[colPlaca]).trim() : '';
                          const valorGuincheiro = parseCurrency(row[colValGuincheiro]);
                          const valorCliente = parseCurrency(row[colValCliente]);
                          
                          if (!cliente && !guincheiro && !placa) continue;
                          if (cliente.toLowerCase() === 'cliente' || guincheiro.toLowerCase() === 'guincheiro') continue;
                          
                          const mes = getMonthName(rawData);
                          const impostos = valorCliente * TAX_RATE;
                          const faturadoAjustado = valorCliente - impostos;
                          const lucroLiquido = faturadoAjustado - valorGuincheiro;
                          
                          const margemLucro = valorCliente > 0 ? (lucroLiquido / valorCliente) : -1;
                          const isPrejuizoOuCritico = (valorCliente === 0 && valorGuincheiro > 0) || (margemLucro < CRITICAL_MARGIN_THRESHOLD);
                          
                          let dataStr = '';
                          if (rawData instanceof Date) {
                              dataStr = rawData.toLocaleDateString('pt-BR');
                          } else if (typeof rawData === 'number') {
                              const dObj = new Date(Math.round((rawData - 25569) * 86400 * 1000));
                              dataStr = dObj.toLocaleDateString('pt-BR');
                          } else {
                              const strVal = String(rawData).trim();
                              const parts = strVal.split(/\D+/).filter(Boolean);
                              if (parts.length >= 3 && parts[0].length === 4) {
                                  dataStr = `${parts[2]}/${parts[1]}/${parts[0]}`;
                              } else {
                                  dataStr = strVal;
                              }
                          }

                          reboqueResult.push({
                              dataStr,
                              mes,
                              cliente,
                              guincheiro,
                              estado,
                              placa,
                              valorGuincheiro,
                              valorCliente,
                              impostos,
                              faturadoAjustado,
                              lucroLiquido,
                              margemLucro,
                              isPrejuizoOuCritico
                          });
                      }
                      return;
                  }

                  // Tratamento padrão das abas mensais de faturamento
                  for (let i = 2; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length < 14) continue;

                    const cliente = row[0] ? String(row[0]).trim() : "";
                    const ocorrencia = row[1] ? String(row[1]).trim() : "Não Informado";
                    const os = row[3] ? String(row[3]).trim() : "";
                    
                    const acionamentoPago = parseCurrency(row[4]);
                    const pedagioPago = parseCurrency(row[7]);
                    const horaPago = parseCurrency(row[5]);
                    const kmPago = parseCurrency(row[6]);
                    
                    const acionamentoCobrado = parseCurrency(row[9]);
                    const pedagioCobrado = parseCurrency(row[12]);
                    const horaCobrado = parseCurrency(row[10]);
                    const kmCobrado = parseCurrency(row[11]);
                    
                    const custo = parseCurrency(row[8]);
                    const faturado = parseCurrency(row[13]);

                    if (!cliente || !os) continue;

                    const impostos = faturado * TAX_RATE;
                    const faturadoAjustado = faturado - impostos;
                    const lucroLiquido = faturadoAjustado - custo;
                    const isProblem = (custo > 0 && faturado === 0) || (faturado < custo);

                    result.push({
                      mes: mesName.toUpperCase().trim(),
                      cliente, ocorrencia, os, custo, faturado, lucroLiquido, isProblem, impostos, faturadoAjustado,
                      lucroBruto: faturado - custo,
                      acionamentoPago, acionamentoCobrado,
                      pedagioPago, horaPago, kmPago,
                      pedagioCobrado, horaCobrado, kmCobrado
                    });
                  }
                });
                
                setData(result);
                setAtendimentosData(atendimentosResult);
                setReboqueData(reboqueResult);
                setAtendimentosReboqueData(atendimentosReboqueResult);
                setIsLoaded(true);
            } catch (error) {
                alert("Erro ao ler os dados. Confirme se a planilha segue a estrutura padrão.");
                console.error(error);
            }
          };

          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
              try {
                const workbook = XLSX.read(event.target.result, { type: 'array' });
                processWorkbook(workbook);
              } catch (error) {
                alert("Erro ao ler o ficheiro. Confirme se é um ficheiro Excel (.xlsx) estruturado corretamente.");
                console.error(error);
              }
            };
            reader.readAsArrayBuffer(file);
          };

          const handleUrlLoad = async () => {
            if (!sheetUrl.trim()) {
                alert("Por favor, insira um link válido.");
                return;
            }
            setIsLoadingUrl(true);
            try {
                let fetchUrl = sheetUrl.trim();
                
                if (fetchUrl.includes('docs.google.com/spreadsheets')) {
                    const match = fetchUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
                    if (match && match[1] && !fetchUrl.includes('pub?')) {
                        fetchUrl = `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=xlsx`;
                    }
                }
                
                const response = await fetch(fetchUrl);
                if (!response.ok) {
                    throw new Error("Acesso negado. Certifique-se de usar a opção 'Publicar na Web' (como XLSX) no Google Sheets.");
                }
                
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                processWorkbook(workbook);
            } catch (err) {
                alert("Erro ao carregar link: " + err.message);
                console.error(err);
            } finally {
                setIsLoadingUrl(false);
            }
          };

          // Consolidado inteligente de clientes integrando faturamento e reboques
          const clients = useMemo(() => {
            const clientesFaturamento = data.map(d => d.cliente);
            const clientesReboque = reboqueData.map(d => d.cliente);
            const clientesAtendimentosReboque = atendimentosReboqueData.map(d => d.cliente);
            return [...new Set([...clientesFaturamento, ...clientesReboque, ...clientesAtendimentosReboque])].filter(Boolean).sort();
          }, [data, reboqueData, atendimentosReboqueData]);
          
          const filteredData = useMemo(() => {
            return data.filter(d => {
              const matchClient = selectedClient === '' || d.cliente.toLowerCase().includes(selectedClient.toLowerCase());
              const matchMonth = selectedMonth === 'Todos' || d.mes === selectedMonth.toUpperCase();
              return matchClient && matchMonth;
            });
          }, [selectedClient, selectedMonth, data]);

          // Filtragem adaptativa para a base financeira de reboques
          const filteredReboqueData = useMemo(() => {
            return reboqueData.filter(d => {
              const matchClient = selectedClient === '' || d.cliente.toLowerCase().includes(selectedClient.toLowerCase());
              const matchMonth = selectedMonth === 'Todos' || d.mes === selectedMonth.toUpperCase();
              return matchClient && matchMonth;
            });
          }, [selectedClient, selectedMonth, reboqueData]);

          // Filtragem adaptativa para os Atendimentos de Reboque
          const filteredAtendimentosReboqueData = useMemo(() => {
            return atendimentosReboqueData.filter(d => {
              const matchClient = selectedClient === '' || d.cliente.toLowerCase().includes(selectedClient.toLowerCase());
              const matchMonth = selectedMonth === 'Todos' || d.mes === selectedMonth.toUpperCase();
              return matchClient && matchMonth;
            });
          }, [selectedClient, selectedMonth, atendimentosReboqueData]);

          const availableMonths = useMemo(() => {
            const mesesFaturamento = data.map(d => d.mes);
            const mesesAtendimentos = atendimentosData.map(d => d.mes);
            const mesesReboque = reboqueData.map(d => d.mes);
            const mesesAtendimentosReboque = atendimentosReboqueData.map(d => d.mes);
            const todosMeses = [...new Set([...mesesFaturamento, ...mesesAtendimentos, ...mesesReboque, ...mesesAtendimentosReboque])].filter(m => m && m !== "TODOS");
            
            const ordemMeses = ["JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO", "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"];
            todosMeses.sort((a, b) => ordemMeses.indexOf(a) - ordemMeses.indexOf(b));

            return ['Todos', ...todosMeses];
          }, [data, atendimentosData, reboqueData, atendimentosReboqueData]);

          const stats = useMemo(() => {
            const totalCusto = filteredData.reduce((acc, curr) => acc + curr.custo, 0);
            const totalFaturado = filteredData.reduce((acc, curr) => acc + curr.faturado, 0);
            const faturadoAjustado = filteredData.reduce((acc, curr) => acc + curr.faturadoAjustado, 0);
            const totalLucro = filteredData.reduce((acc, curr) => acc + curr.lucroLiquido, 0);
            return { totalCusto, totalFaturado, faturadoAjustado, totalLucro, totalOS: filteredData.length };
          }, [filteredData]);

          // Cálculo dos KPIs de Reboque baseados na aba financeira + contagem real de atendimentos
          const reboqueStats = useMemo(() => {
            let faturamentoTotal = 0;
            let custoTotal = 0;
            let impostosTotal = 0;
            let lucroLiquidoTotal = 0;
            let reboquesCriticosCount = 0;

            filteredReboqueData.forEach(d => {
              faturamentoTotal += d.valorCliente;
              custoTotal += d.valorGuincheiro;
              impostosTotal += d.impostos;
              lucroLiquidoTotal += d.lucroLiquido;
              if (d.isPrejuizoOuCritico) {
                reboquesCriticosCount += 1;
              }
            });

            const margemMedia = faturamentoTotal > 0 ? (lucroLiquidoTotal / faturamentoTotal) : 0;
            const totalViagens = atendimentosReboqueData.length > 0 ? filteredAtendimentosReboqueData.length : filteredReboqueData.length;

            return {
              faturamentoTotal,
              custoTotal,
              impostosTotal,
              lucroLiquidoTotal,
              reboquesCriticosCount,
              margemMedia,
              totalViagens
            };
          }, [filteredReboqueData, filteredAtendimentosReboqueData]);

          // Agrupamentos e Dados de Gráficos do Reboque
          const reboqueByMonth = useMemo(() => {
            const agg = {};
            
            // Mapeia o faturamento financeiro vindo da aba REBOQUE
            filteredReboqueData.forEach(d => {
              if (d.mes === "TODOS" || !d.mes) return;
              if (!agg[d.mes]) agg[d.mes] = { mes: d.mes, faturado: 0, custo: 0, lucro: 0, viagens: 0 };
              agg[d.mes].faturado += d.valorCliente;
              agg[d.mes].custo += d.valorGuincheiro;
              agg[d.mes].lucro += d.lucroLiquido;
            });
            
            // Se houver dados granulares de atendimentos, usamos eles para contar a volumetria física exata de viagens
            if (atendimentosReboqueData.length > 0) {
              filteredAtendimentosReboqueData.forEach(d => {
                if (d.mes === "TODOS" || !d.mes) return;
                if (!agg[d.mes]) agg[d.mes] = { mes: d.mes, faturado: 0, custo: 0, lucro: 0, viagens: 0 };
                agg[d.mes].viagens += 1;
              });
            } else {
              filteredReboqueData.forEach(d => {
                if (d.mes === "TODOS" || !d.mes) return;
                agg[d.mes].viagens += 1;
              });
            }

            const ordemMeses = ["JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO", "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"];
            return Object.values(agg).sort((a, b) => ordemMeses.indexOf(a.mes) - ordemMeses.indexOf(b.mes));
          }, [filteredReboqueData, filteredAtendimentosReboqueData, atendimentosReboqueData]);

          const reboqueByClient = useMemo(() => {
            const agg = {};
            
            filteredReboqueData.forEach(d => {
              if (!agg[d.cliente]) agg[d.cliente] = { cliente: d.cliente, faturado: 0, custo: 0, lucro: 0, viagens: 0 };
              agg[d.cliente].faturado += d.valorCliente;
              agg[d.cliente].custo += d.valorGuincheiro;
              agg[d.cliente].lucro += d.lucroLiquido;
            });

            if (atendimentosReboqueData.length > 0) {
              filteredAtendimentosReboqueData.forEach(d => {
                if (!agg[d.cliente]) agg[d.cliente] = { cliente: d.cliente, faturado: 0, custo: 0, lucro: 0, viagens: 0 };
                agg[d.cliente].viagens += 1;
              });
            } else {
              filteredReboqueData.forEach(d => {
                agg[d.cliente].viagens += 1;
              });
            }

            return Object.values(agg).sort((a, b) => b.faturado - a.faturado).slice(0, 10);
          }, [filteredReboqueData, filteredAtendimentosReboqueData, atendimentosReboqueData]);

          // Demanda Geográfica de Reboques calculada a partir de "Atendimentos de reboque" (UF Origem) se disponível
          const reboqueByRegion = useMemo(() => {
            const agg = {};
            
            // 1. Levantamento de volumetria (Demandas por Estado) a partir de "Atendimentos de reboque" (coluna UF Origem)
            if (atendimentosData.length > 0 && reboqueData.length > 0) {
                filteredReboqueData.forEach(d => {
                    const reg = d.estado || 'N/A';
                    if (!agg[reg]) {
                        agg[reg] = { estado: reg, total: 0, faturado: 0, custo: 0, lucro: 0 };
                    }
                    agg[reg].faturado += d.valorCliente;
                    agg[reg].custo += d.valorGuincheiro;
                    agg[reg].lucro += d.lucroLiquido;
                });

                if (atendimentosReboqueData.length > 0) {
                    filteredAtendimentosReboqueData.forEach(d => {
                        const reg = d.estado || 'N/A';
                        if (!agg[reg]) {
                            agg[reg] = { estado: reg, total: 0, faturado: 0, custo: 0, lucro: 0 };
                        }
                        agg[reg].total += 1;
                    });
                } else {
                    filteredReboqueData.forEach(d => {
                        const reg = d.estado || 'N/A';
                        agg[reg].total += 1;
                    });
                }
            } else {
                // Fallback padrão se não houver a aba de atendimentos de reboque
                filteredReboqueData.forEach(d => {
                    const reg = d.estado || 'N/A';
                    if (!agg[reg]) {
                        agg[reg] = { estado: reg, total: 0, faturado: 0, custo: 0, lucro: 0 };
                    }
                    agg[reg].total += 1;
                    agg[reg].faturado += d.valorCliente;
                    agg[reg].custo += d.valorGuincheiro;
                    agg[reg].lucro += d.lucroLiquido;
                });
            }

            return Object.values(agg).sort((a, b) => b.total - a.total);
          }, [filteredReboqueData, filteredAtendimentosReboqueData, atendimentosReboqueData, atendimentosData]);

          // Ranking de guincheiros cruzado. O número de Chamados vem da aba granular de atendimentos.
          const reboqueByGuincheiro = useMemo(() => {
            const agg = {};
            
            // 1. Carrega o faturamento e custos da aba REBOQUE consolidada
            filteredReboqueData.forEach(d => {
              const guinch = d.guincheiro || 'N/A';
              if (!agg[guinch]) {
                agg[guinch] = { guincheiro: guinch, total: 0, faturado: 0, custo: 0, lucro: 0 };
              }
              agg[guinch].faturado += d.valorCliente;
              agg[guinch].custo += d.valorGuincheiro;
              agg[guinch].lucro += d.lucroLiquido;
            });

            // 2. Mapeia a quantidade real de chamados físicos da aba "Atendimentos de reboque"
            if (atendimentosReboqueData.length > 0) {
                filteredAtendimentosReboqueData.forEach(d => {
                    const guinch = d.prestador || 'N/A';
                    if (!agg[guinch]) {
                        agg[guinch] = { guincheiro: guinch, total: 0, faturado: 0, custo: 0, lucro: 0 };
                    }
                    agg[guinch].total += 1;
                });
            } else {
                // Fallback se não possuir a aba granular
                filteredReboqueData.forEach(d => {
                    const guinch = d.guincheiro || 'N/A';
                    agg[guinch].total += 1;
                });
            }

            return Object.values(agg).map(g => {
                const rentabilidade = g.faturado > 0 ? (g.lucro / g.faturado) : 0;
                return { ...g, rentabilidade };
            }).sort((a, b) => b.rentabilidade - a.rentabilidade); // Ordenado do mais rentável para o menos rentável (custos otimizados)
          }, [filteredReboqueData, filteredAtendimentosReboqueData, atendimentosReboqueData]);

          const serviceDistribution = useMemo(() => {
            const counts = {};
            filteredData.forEach(d => { counts[d.ocorrencia] = (counts[d.ocorrencia] || 0) + 1; });
            return Object.entries(counts).map(([tipo, qtd]) => ({ tipo, qtd })).sort((a, b) => b.qtd - a.qtd);
          }, [filteredData]);

          const ranking = useMemo(() => {
            const agg = {};
            filteredData.forEach(d => {
              if (!agg[d.cliente]) agg[d.cliente] = { nome: d.cliente, lucroTotal: 0, faturadoTotal: 0, osCount: 0 };
              agg[d.cliente].lucroTotal += d.lucroLiquido;
              agg[d.cliente].faturadoTotal += d.faturado;
              agg[d.cliente].osCount += 1;
            });
            return Object.values(agg).map(c => {
                let rentabilidade = 0;
                if (c.faturadoTotal > 0) { rentabilidade = c.lucroTotal / c.faturadoTotal; } 
                else if (c.lucroTotal < 0) { rentabilidade = -1; }
                return { ...c, rentabilidade, rentabilidadeParaGrafico: rentabilidade * 100 };
            }).sort((a, b) => b.rentabilidade - a.rentabilidade); 
          }, [filteredData]);

          const evolutionData = useMemo(() => {
            const agg = {};
            filteredData.forEach(d => {
              if (!agg[d.mes]) agg[d.mes] = { mes: d.mes, faturado: 0, osCount: 0, lucro: 0 };
              agg[d.mes].faturado += d.faturado;
              agg[d.mes].osCount += 1;
              agg[d.mes].lucro += d.lucroLiquido;
            });
            return Object.values(agg);
          }, [filteredData]);

          const formatBRL = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
          const formatPercent = (val) => new Intl.NumberFormat('pt-BR', { style: 'percent', minimumFractionDigits: 1 }).format(val);

          const clientActivity = useMemo(() => {
              if (!atendimentosData || atendimentosData.length === 0) return { list: [], mesAtualStr: 'N/A', mesAnteriorStr: 'N/A' };

              const today = new Date();
              const ordemMeses = ["JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO", "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"];

              let maxMonthIdx = -1;
              atendimentosData.forEach(d => {
                  const idx = ordemMeses.indexOf(d.mes);
                  if (idx > maxMonthIdx) maxMonthIdx = idx;
              });

              const mesAtualStr = maxMonthIdx >= 0 ? ordemMeses[maxMonthIdx] : "TODOS";
              const mesAnteriorStr = maxMonthIdx > 0 ? ordemMeses[maxMonthIdx - 1] : (maxMonthIdx === 0 ? "DEZEMBRO" : "TODOS");

              const agg = {};
              atendimentosData.forEach(d => {
                  const cName = d.cliente;
                  if (cName === "Não Informado") return;

                  if (!agg[cName]) {
                      agg[cName] = { cliente: cName, ultimaData: null, total: 0, mesAtual: 0, mesAnterior: 0 };
                  }
                  
                  agg[cName].total += 1;
                  if (d.mes === mesAtualStr) agg[cName].mesAtual += 1;
                  if (d.mes === mesAnteriorStr) agg[cName].mesAnterior += 1;

                  if (d.dataExata) {
                      if (!agg[cName].ultimaData || d.dataExata > agg[cName].ultimaData) {
                          agg[cName].ultimaData = d.dataExata;
                      }
                  }
              });

              const list = Object.values(agg).map(item => {
                  let dias = "N/D";
                  let dataStr = "N/D";
                  if (item.ultimaData) {
                      const diffTime = Math.floor((today - item.ultimaData) / (1000 * 60 * 60 * 24));
                      dias = diffTime >= 0 ? diffTime : 0; 
                      dataStr = item.ultimaData.toLocaleDateString('pt-BR');
                  }
                  return { ...item, diasSemAcionar: dias, dataUltimoAcionamento: dataStr };
              }).sort((a, b) => {
                  const diasA = a.diasSemAcionar === "N/D" ? -1 : a.diasSemAcionar;
                  const diasB = b.diasSemAcionar === "N/D" ? -1 : b.diasSemAcionar;
                  
                  if (diasB === diasA) {
                      return b.total - a.total;
                  }
                  return diasB - diasA;
              });

              return { list, mesAtualStr, mesAnteriorStr };
          }, [atendimentosData]);

          const analisesStats = useMemo(() => {
            if (atendimentosData.length === 0) return null;

            const baseData = selectedMonth === 'Todos' 
                ? atendimentosData 
                : atendimentosData.filter(d => d.mes === selectedMonth.toUpperCase());

            if (baseData.length === 0) return { rankingApoios: [], statusData: [], regiaoData: [], total: 0 };

            const apoiosMap = {};
            const statusMap = { "Recuperado": 0, "Não Recuperado": 0 };
            const regiaoMap = {};

            baseData.forEach(d => {
                if (!apoiosMap[d.apoio]) apoiosMap[d.apoio] = { nome: d.apoio, total: 0, recuperados: 0 };
                apoiosMap[d.apoio].total += 1;
                
                const s = String(d.status).toLowerCase();
                const isSuccess = (s.includes('recuperado') || s.includes('localizado') || s.includes('sucesso')) && !s.includes('não') && !s.includes('nao');

                if (isSuccess) {
                    apoiosMap[d.apoio].recuperados += 1;
                    statusMap["Recuperado"] += 1;
                } else {
                    statusMap["Não Recuperado"] += 1;
                }
                
                if (!regiaoMap[d.regiao]) regiaoMap[d.regiao] = { regiao: d.regiao, total: 0, recuperados: 0 };
                regiaoMap[d.regiao].total += 1;
                if (isSuccess) {
                    regiaoMap[d.regiao].recuperados += 1;
                }
            });

            const rankingApoios = Object.values(apoiosMap)
                .map(a => ({ ...a, taxaSucesso: a.total > 0 ? (a.recuperados / a.total) * 100 : 0 }))
                .sort((a, b) => b.total - a.total)
                .slice(0, 15);

            const statusData = Object.entries(statusMap)
                .map(([name, value]) => ({
                    name, 
                    value, 
                    color: name === "Recuperado" ? '#10b981' : '#ef4444'
                }));

            const regiaoData = Object.values(regiaoMap)
                .map(r => ({ ...r, taxaSucesso: r.total > 0 ? (r.recuperados / r.total) * 100 : 0 }))
                .sort((a,b) => b.total - a.total);

            return { rankingApoios, statusData, regiaoData, total: baseData.length };
          }, [atendimentosData, selectedMonth]);

          useEffect(() => {
            if (selectedMonth !== 'Todos' && !availableMonths.includes(selectedMonth)) {
              setSelectedMonth('Todos');
            }
          }, [selectedClient, availableMonths, selectedMonth]);

          if (!isLoaded) {
            return (
              <div className="min-h-screen flex flex-col items-center justify-center p-4 md:p-8 text-center bg-[#020617] text-white">
                <h1 className="text-4xl font-black uppercase mb-4 tracking-tighter">Análise de Custos</h1>
                <p className="text-slate-400 max-w-md mb-10 leading-relaxed font-medium">
                  Ferramenta de apoio estratégico ao controle de custos operacionais.
                </p>
                
                <div className="w-full max-w-md space-y-6">
                    <div className="bg-white/5 border border-white/10 p-6 rounded-[2rem] backdrop-blur-md transition-all focus-within:border-blue-500 shadow-xl">
                        <div className="flex flex-col gap-4">
                            <label className="text-[10px] font-black uppercase tracking-[0.3em] text-slate-400 text-left flex items-center gap-2">
                                <LinkIcon size={14} className="text-blue-500" /> Planilha Online (URL)
                            </label>
                            <div className="flex flex-col sm:flex-row gap-2">
                                <input
                                    type="text"
                                    placeholder="Cole o link do Sheets (.xlsx)..."
                                    value={sheetUrl}
                                    onChange={(e) => setSheetUrl(e.target.value)}
                                    className="flex-1 bg-black/40 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder:text-slate-600 focus:outline-none focus:border-blue-500 transition-colors"
                                />
                                <button
                                    onClick={handleUrlLoad}
                                    disabled={isLoadingUrl}
                                    className="bg-blue-600 hover:bg-blue-500 text-white font-black text-xs uppercase px-6 py-3 rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap"
                                >
                                    {isLoadingUrl ? 'Lendo...' : 'Carregar'}
                                </button>
                            </div>
                            <p className="text-[10px] text-slate-500 italic text-left">Dica: No Google Sheets, use "Arquivo &gt; Compartilhar &gt; Publicar na Web" e escolha o formato Excel.</p>
                        </div>
                    </div>

                    <div className="flex items-center gap-4 w-full px-4">
                        <div className="h-px bg-slate-800 flex-1"></div>
                        <span className="text-[10px] font-black text-slate-600 uppercase tracking-widest">OU</span>
                        <div className="h-px bg-slate-800 flex-1"></div>
                    </div>

                    <label className="cursor-pointer group relative block">
                      <div className="flex flex-col items-center p-12 border-2 border-dashed border-slate-700 rounded-[2.5rem] group-hover:border-blue-500 transition-all bg-white/5 backdrop-blur-md shadow-xl">
                        <UploadIcon size={36} className="text-slate-500 group-hover:text-blue-500 mb-4 transition-transform group-hover:scale-110" />
                        <span className="font-black text-xs uppercase tracking-[0.3em] text-slate-400 group-hover:text-white text-center">Arquivo Local (.xlsx)</span>
                        <p className="text-[10px] text-slate-500 mt-3 italic max-w-xs text-center">Certifique-se de que o ficheiro possui abas correspondentes aos meses estruturadas corretamente.</p>
                        <input type="file" accept=".xlsx, .xls, .csv" className="hidden" onChange={handleFileUpload} />
