<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Custos RNS</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Dependências do Recharts -->
    <script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-is@18.2.0/umd/react-is.production.min.js"></script>
    
    <!-- Babel (Para compilar o código React no navegador) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Recharts (Gráficos) -->
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>

    <!-- SheetJS (Versão cravada na 0.20.1 para evitar quebras por atualizações instáveis) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <style>
        body { 
            background-color: #020617; 
            color: #f8fafc; 
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; 
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 4px; }
        
        /* Remove o ícone de seta do datalist em alguns navegadores para ficar mais limpo */
        input::-webkit-calendar-picker-indicator {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Cell, LabelList, ComposedChart, Line, Legend, PieChart, Pie } = window.Recharts;

        const AlertTriangle = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>;
        const Filter = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>;
        const Award = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>;
        const LayoutDashboard = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>;
        const UploadIcon = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>;
        const ClipboardList = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>;
        const BarChart3 = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>;
        const LineChartIcon = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>;
        const CalendarIcon = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>;
        const SearchIcon = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
        const LinkIcon = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>;
        const ChevronDown = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 12 15 18 9"/></svg>;
        const PieChartIcon = ({size=24, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>;

        const TAX_RATE = 0.20;

        const App = () => {
          const [data, setData] = useState([]);
          const [atendimentosData, setAtendimentosData] = useState([]);
          const [activeTab, setActiveTab] = useState('geral');
          const [selectedClient, setSelectedClient] = useState('');
          const [selectedMonth, setSelectedMonth] = useState('Todos');
          const [isLoaded, setIsLoaded] = useState(false);
          const [sheetUrl, setSheetUrl] = useState('');
          const [isLoadingUrl, setIsLoadingUrl] = useState(false);
          const [isClientListOpen, setIsClientListOpen] = useState(false);

          // Novos estados para controlar a exibição das tabelas (Accordion UI)
          const [showCruzamento, setShowCruzamento] = useState(false);
          const [showFaturamento, setShowFaturamento] = useState(false);
          const [showBaseAtiva, setShowBaseAtiva] = useState(false);

          const parseCurrency = (value) => {
            if (value === undefined || value === null) return 0;
            if (typeof value === 'number') return value;
            const cleanValue = String(value).replace('R$', '').replace(/\s/g, '').replace(/\./g, '').replace(',', '.').trim();
            const num = parseFloat(cleanValue);
            return isNaN(num) ? 0 : num;
          };

          // Analisa a coluna anômala de data (transforma Excel Serial ou String CSV em Mês)
          const getMonthName = (val) => {
              if (!val) return "TODOS";
              const MONTHS = ["JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO", "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"];

              // Se a data vier como serial do Excel (ex: 44562)
              if (typeof val === 'number') {
                  const date = new Date(Math.round((val - 25569) * 86400 * 1000));
                  return MONTHS[date.getUTCMonth()];
              }
              // Se a data vier como string (ex: "15/04/2023" do CSV)
              if (typeof val === 'string') {
                  const parts = val.split(/[-/]/);
                  if (parts.length >= 3) {
                      const m = parts[0].length === 4 ? parseInt(parts[1], 10) : parseInt(parts[1], 10);
                      if (!isNaN(m) && m >= 1 && m <= 12) return MONTHS[m - 1];
                  }
                  // Busca brutal pelo nome do mês dentro da string
                  for (let m of MONTHS) {
                      if (val.toUpperCase().includes(m)) return m;
                  }
              }
              return "TODOS";
          };

          const processWorkbook = (workbook) => {
            try {
                const result = [];
                const atendimentosResult = [];

                workbook.SheetNames.forEach(mesName => {
                  const sheet = workbook.Sheets[mesName];
                  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

                  // Isola e processa a aba ATENDIMENTOS (não entra como mês)
                  if (mesName.toUpperCase().trim() === 'ATENDIMENTOS') {
                      if (rows.length < 2) return;
                      const headers = rows[0].map(h => h ? String(h).toLowerCase().trim() : '');
                      
                      const idxApoio = headers.findIndex(h => h.includes('apoio') || h.includes('nome'));
                      const idxStatus = headers.findIndex(h => h.includes('status') || h.includes('recuperado') || h.includes('recuperação') || h.includes('resultado'));
                      const idxRegiao = headers.findIndex(h => h.includes('estado') || h.includes('uf') || h.includes('região') || h.includes('regiao'));
                      
                      // Índices fixados e cravados conforme sua instrução, ignorando o texto do cabeçalho
                      const idxCliente = 4; // Coluna E
                      const idxData = 25;   // Coluna Z

                      for (let i = 1; i < rows.length; i++) {
                          const row = rows[i];
                          if (!row || row.length === 0) continue;
                          
                          const apoio = idxApoio !== -1 && row[idxApoio] ? String(row[idxApoio]).trim() : "Não Informado";
                          const status = idxStatus !== -1 && row[idxStatus] ? String(row[idxStatus]).trim() : "Indefinido";
                          const regiao = idxRegiao !== -1 && row[idxRegiao] ? String(row[idxRegiao]).trim().toUpperCase() : "NI";
                          
                          // Leitura forçada nas colunas E e Z
                          const cliente = row[idxCliente] ? String(row[idxCliente]).trim() : "Não Informado";
                          const rawDate = row[idxData];
                          
                          // Extrai o mês correspondente da célula (seja serial Excel ou String)
                          const mesFormatado = rawDate ? getMonthName(rawDate) : "TODOS";
                          
                          // Extração de Data Exata para cálculo de ociosidade
                          let dataExata = null;
                          if (typeof rawDate === 'number') {
                              dataExata = new Date(Math.round((rawDate - 25569) * 86400 * 1000));
                          } else if (typeof rawDate === 'string') {
                              const parts = rawDate.split(/[-/]/);
                              if (parts.length >= 3) {
                                  const isYearFirst = parts[0].length === 4;
                                  const d = isYearFirst ? parseInt(parts[2], 10) : parseInt(parts[0], 10);
                                  const m = isYearFirst ? parseInt(parts[1], 10) - 1 : parseInt(parts[1], 10) - 1;
                                  const y = isYearFirst ? parseInt(parts[0], 10) : (parts[2].length === 2 ? 2000 + parseInt(parts[2], 10) : parseInt(parts[2], 10));
                                  dataExata = new Date(y, m, d);
                              }
                          }
                          if (dataExata && isNaN(dataExata.getTime())) dataExata = null;

                          if (apoio !== "Não Informado" || status !== "Indefinido") {
                              atendimentosResult.push({ apoio, status, regiao, mes: mesFormatado, cliente, dataExata });
                          }
                      }
                      return; // Impede que ATENDIMENTOS seja listado como uma aba de mês normal
                  }

                  // Dados Gerais das abas mensais de faturamento
                  for (let i = 2; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length < 14) continue;

                    const cliente = row[0] ? String(row[0]).trim() : "";
                    const ocorrencia = row[1] ? String(row[1]).trim() : "Não Informado";
                    const os = row[3] ? String(row[3]).trim() : "";
                    
                    // Ajuste de índices: A=0, B=1, C=2, D=3, E=4, F=5, G=6, H=7, I=8, J=9, K=10, L=11, M=12, N=13
                    // Prestador (Pago): Acionamento E(4), Pedágio H(7), Hora F(5), KM G(6)
                    const acionamentoPago = parseCurrency(row[4]);
                    const pedagioPago = parseCurrency(row[7]);
                    const horaPago = parseCurrency(row[5]);
                    const kmPago = parseCurrency(row[6]);
                    
                    // Cliente (Cobrado): Acionamento J(9), Pedágio M(12), Hora K(10), KM L(11)
                    const acionamentoCobrado = parseCurrency(row[9]);
                    const pedagioCobrado = parseCurrency(row[12]);
                    const horaCobrado = parseCurrency(row[10]);
                    const kmCobrado = parseCurrency(row[11]);
                    
                    const custo = parseCurrency(row[8]); // Custo total na coluna I
                    const faturado = parseCurrency(row[13]); // Faturado total na coluna N

                    if (!cliente || !os) continue;

                    const impostos = faturado * TAX_RATE;
                    const faturadoAjustado = faturado - impostos;
                    const lucroLiquido = faturadoAjustado - custo;
                    const isProblem = (custo > 0 && faturado === 0) || (faturado < custo);

                    result.push({
                      mes: mesName.toUpperCase().trim(),
                      cliente, ocorrencia, os, custo, faturado, lucroLiquido, isProblem, impostos, faturadoAjustado,
                      lucroBruto: faturado - custo,
                      acionamentoPago, acionamentoCobrado,
                      pedagioPago, horaPago, kmPago,
                      pedagioCobrado, horaCobrado, kmCobrado
                    });
                  }
                });
                
                setData(result);
                setAtendimentosData(atendimentosResult);
                setIsLoaded(true);
            } catch (error) {
                alert("Erro ao ler os dados. Confirme se a planilha segue a estrutura padrão.");
                console.error(error);
            }
          };

          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
              try {
                const workbook = XLSX.read(event.target.result, { type: 'array' });
                processWorkbook(workbook);
              } catch (error) {
                alert("Erro ao ler o ficheiro. Confirme se é um ficheiro Excel (.xlsx) estruturado corretamente.");
                console.error(error);
              }
            };
            reader.readAsArrayBuffer(file);
          };

          const handleUrlLoad = async () => {
            if (!sheetUrl.trim()) {
                alert("Por favor, insira um link válido.");
                return;
            }
            setIsLoadingUrl(true);
            try {
                let fetchUrl = sheetUrl.trim();
                
                if (fetchUrl.includes('docs.google.com/spreadsheets')) {
                    const match = fetchUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
                    if (match && match[1] && !fetchUrl.includes('pub?')) {
                        fetchUrl = `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=xlsx`;
                    }
                }
                
                const response = await fetch(fetchUrl);
                if (!response.ok) {
                    throw new Error("Acesso negado. Certifique-se de usar a opção 'Publicar na Web' (como XLSX) no Google Sheets.");
                }
                
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                processWorkbook(workbook);
            } catch (err) {
                alert("Erro ao carregar link: " + err.message);
                console.error(err);
            } finally {
                setIsLoadingUrl(false);
            }
          };

          const clients = useMemo(() => {
            return [...new Set(data.map(d => d.cliente))].sort();
          }, [data]);
          
          const filteredData = useMemo(() => {
            return data.filter(d => {
              const matchClient = selectedClient === '' || d.cliente.toLowerCase().includes(selectedClient.toLowerCase());
              const matchMonth = selectedMonth === 'Todos' || d.mes === selectedMonth.toUpperCase();
              return matchClient && matchMonth;
            });
          }, [selectedClient, selectedMonth, data]);

          // CORREÇÃO ESTRATÉGICA: O filtro de meses agora varre TODA a base (Faturamento + Atendimentos) 
          // e ordena cronologicamente de forma rígida.
          const availableMonths = useMemo(() => {
            const mesesFaturamento = data.map(d => d.mes);
            const mesesAtendimentos = atendimentosData.map(d => d.mes);
            const todosMeses = [...new Set([...mesesFaturamento, ...mesesAtendimentos])].filter(m => m && m !== "TODOS");
            
            const ordemMeses = ["JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO", "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"];
            todosMeses.sort((a, b) => ordemMeses.indexOf(a) - ordemMeses.indexOf(b));

            return ['Todos', ...todosMeses];
          }, [data, atendimentosData]);

          const stats = useMemo(() => {
            const totalCusto = filteredData.reduce((acc, curr) => acc + curr.custo, 0);
            const totalFaturado = filteredData.reduce((acc, curr) => acc + curr.faturado, 0);
            const faturadoAjustado = filteredData.reduce((acc, curr) => acc + curr.faturadoAjustado, 0);
            const totalLucro = filteredData.reduce((acc, curr) => acc + curr.lucroLiquido, 0);
            return { totalCusto, totalFaturado, faturadoAjustado, totalLucro, totalOS: filteredData.length };
          }, [filteredData]);

          const serviceDistribution = useMemo(() => {
            const counts = {};
            filteredData.forEach(d => { counts[d.ocorrencia] = (counts[d.ocorrencia] || 0) + 1; });
            return Object.entries(counts).map(([tipo, qtd]) => ({ tipo, qtd })).sort((a, b) => b.qtd - a.qtd);
          }, [filteredData]);

          const ranking = useMemo(() => {
            const agg = {};
            filteredData.forEach(d => {
              if (!agg[d.cliente]) agg[d.cliente] = { nome: d.cliente, lucroTotal: 0, faturadoTotal: 0, osCount: 0 };
              agg[d.cliente].lucroTotal += d.lucroLiquido;
              agg[d.cliente].faturadoTotal += d.faturado;
              agg[d.cliente].osCount += 1;
            });
            return Object.values(agg).map(c => {
                let rentabilidade = 0;
                if (c.faturadoTotal > 0) { rentabilidade = c.lucroTotal / c.faturadoTotal; } 
                else if (c.lucroTotal < 0) { rentabilidade = -1; }
                return { ...c, rentabilidade, rentabilidadeParaGrafico: rentabilidade * 100 };
            }).sort((a, b) => b.rentabilidade - a.rentabilidade); 
          }, [filteredData]);

          const evolutionData = useMemo(() => {
            const agg = {};
            filteredData.forEach(d => {
              if (!agg[d.mes]) agg[d.mes] = { mes: d.mes, faturado: 0, osCount: 0, lucro: 0 };
              agg[d.mes].faturado += d.faturado;
              agg[d.mes].osCount += 1;
              agg[d.mes].lucro += d.lucroLiquido;
            });
            return Object.values(agg);
          }, [filteredData]);

          const formatBRL = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
          const formatPercent = (val) => new Intl.NumberFormat('pt-BR', { style: 'percent', minimumFractionDigits: 1 }).format(val);

          // Análise de Frequência de Acionamentos da aba ATENDIMENTOS
          const clientActivity = useMemo(() => {
              if (!atendimentosData || atendimentosData.length === 0) return { list: [], mesAtualStr: 'N/A', mesAnteriorStr: 'N/A' };

              const today = new Date();
              const ordemMeses = ["JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO", "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"];

              // Descobre o mês mais recente cadastrado para definir o "Atual" e o "Anterior"
              let maxMonthIdx = -1;
              atendimentosData.forEach(d => {
                  const idx = ordemMeses.indexOf(d.mes);
                  if (idx > maxMonthIdx) maxMonthIdx = idx;
              });

              const mesAtualStr = maxMonthIdx >= 0 ? ordemMeses[maxMonthIdx] : "TODOS";
              const mesAnteriorStr = maxMonthIdx > 0 ? ordemMeses[maxMonthIdx - 1] : (maxMonthIdx === 0 ? "DEZEMBRO" : "TODOS");

              const agg = {};
              atendimentosData.forEach(d => {
                  const cName = d.cliente;
                  if (cName === "Não Informado") return; // Filtra lixo

                  if (!agg[cName]) {
                      agg[cName] = { cliente: cName, ultimaData: null, total: 0, mesAtual: 0, mesAnterior: 0 };
                  }
                  
                  agg[cName].total += 1;
                  if (d.mes === mesAtualStr) agg[cName].mesAtual += 1;
                  if (d.mes === mesAnteriorStr) agg[cName].mesAnterior += 1;

                  if (d.dataExata) {
                      if (!agg[cName].ultimaData || d.dataExata > agg[cName].ultimaData) {
                          agg[cName].ultimaData = d.dataExata;
                      }
                  }
              });

              const list = Object.values(agg).map(item => {
                  let dias = "N/D";
                  let dataStr = "N/D";
                  if (item.ultimaData) {
                      const diffTime = Math.floor((today - item.ultimaData) / (1000 * 60 * 60 * 24));
                      dias = diffTime >= 0 ? diffTime : 0; // Previne datas futuras erradas do excel
                      dataStr = item.ultimaData.toLocaleDateString('pt-BR');
                  }
                  return { ...item, diasSemAcionar: dias, dataUltimoAcionamento: dataStr };
              }).sort((a, b) => b.total - a.total); // Ordena pelo maior volume total

              return { list, mesAtualStr, mesAnteriorStr };
          }, [atendimentosData]);

          // Análises da aba Atendimentos (Agora com Filtro de Mês Ativo e Regra Binária)
          const analisesStats = useMemo(() => {
            if (atendimentosData.length === 0) return null;

            // Filtro cruzado de mês. Exige que o mês da ocorrência bata com o filtro selecionado globalmente.
            const baseData = selectedMonth === 'Todos' 
                ? atendimentosData 
                : atendimentosData.filter(d => d.mes === selectedMonth.toUpperCase());

            if (baseData.length === 0) return { rankingApoios: [], statusData: [], regiaoData: [], total: 0 };

            const apoiosMap = {};
            const statusMap = { "Recuperado": 0, "Não Recuperado": 0 }; // Regra Estratégica Binária
            const regiaoMap = {};

            baseData.forEach(d => {
                if (!apoiosMap[d.apoio]) apoiosMap[d.apoio] = { nome: d.apoio, total: 0, recuperados: 0 };
                apoiosMap[d.apoio].total += 1;
                
                const s = String(d.status).toLowerCase();
                
                // Mapeia sucesso se encontrar palavras-chave afirmativas, ignorando strings com negativas
                const isSuccess = (s.includes('recuperado') || s.includes('localizado') || s.includes('sucesso')) && !s.includes('não') && !s.includes('nao');

                if (isSuccess) {
                    apoiosMap[d.apoio].recuperados += 1;
                    statusMap["Recuperado"] += 1;
                } else {
                    statusMap["Não Recuperado"] += 1;
                }
                
                if (!regiaoMap[d.regiao]) regiaoMap[d.regiao] = { regiao: d.regiao, total: 0, recuperados: 0 };
                regiaoMap[d.regiao].total += 1;
                if (isSuccess) {
                    regiaoMap[d.regiao].recuperados += 1;
                }
            });

            const rankingApoios = Object.values(apoiosMap)
                .map(a => ({ ...a, taxaSucesso: a.total > 0 ? (a.recuperados / a.total) * 100 : 0 }))
                .sort((a, b) => b.total - a.total)
                .slice(0, 15);

            // Monta o array da Pizza apenas com os binários, amarrando cores para evitar confusão visual
            const statusData = Object.entries(statusMap)
                .map(([name, value]) => ({
                    name, 
                    value, 
                    color: name === "Recuperado" ? '#10b981' : '#ef4444' // Verde e Vermelho
                }));

            const regiaoData = Object.values(regiaoMap)
                .map(r => ({ ...r, taxaSucesso: r.total > 0 ? (r.recuperados / r.total) * 100 : 0 }))
                .sort((a,b) => b.total - a.total);

            return { rankingApoios, statusData, regiaoData, total: baseData.length };
          }, [atendimentosData, selectedMonth]);

          useEffect(() => {
            if (selectedMonth !== 'Todos' && !availableMonths.includes(selectedMonth)) {
              setSelectedMonth('Todos');
            }
          }, [selectedClient, availableMonths, selectedMonth]);

          // Tela de Upload Inicial
          if (!isLoaded) {
            return (
              <div className="min-h-screen flex flex-col items-center justify-center p-4 md:p-8 text-center bg-[#020617] text-white">
                <h1 className="text-4xl font-black uppercase mb-4 tracking-tighter">Análise de Custos</h1>
                <p className="text-slate-400 max-w-md mb-10 leading-relaxed font-medium">
                  Ferramenta de apoio estratégico ao controle de custos operacionais.
                </p>
                
                <div className="w-full max-w-md space-y-6">
                    <div className="bg-white/5 border border-white/10 p-6 rounded-[2rem] backdrop-blur-md transition-all focus-within:border-blue-500 shadow-xl">
                        <div className="flex flex-col gap-4">
                            <label className="text-[10px] font-black uppercase tracking-[0.3em] text-slate-400 text-left flex items-center gap-2">
                                <LinkIcon size={14} className="text-blue-500" /> Planilha Online (URL)
                            </label>
                            <div className="flex flex-col sm:flex-row gap-2">
                                <input
                                    type="text"
                                    placeholder="Cole o link do Sheets (.xlsx)..."
                                    value={sheetUrl}
                                    onChange={(e) => setSheetUrl(e.target.value)}
                                    className="flex-1 bg-black/40 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder:text-slate-600 focus:outline-none focus:border-blue-500 transition-colors"
                                />
                                <button
                                    onClick={handleUrlLoad}
                                    disabled={isLoadingUrl}
                                    className="bg-blue-600 hover:bg-blue-500 text-white font-black text-xs uppercase px-6 py-3 rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap"
                                >
                                    {isLoadingUrl ? 'Lendo...' : 'Carregar'}
                                </button>
                            </div>
                            <p className="text-[10px] text-slate-500 italic text-left">Dica: No Google Sheets, use "Arquivo > Compartilhar > Publicar na Web" e escolha o formato Excel.</p>
                        </div>
                    </div>

                    <div className="flex items-center gap-4 w-full px-4">
                        <div className="h-px bg-slate-800 flex-1"></div>
                        <span className="text-[10px] font-black text-slate-600 uppercase tracking-widest">OU</span>
                        <div className="h-px bg-slate-800 flex-1"></div>
                    </div>

                    <label className="cursor-pointer group relative block">
                      <div className="flex flex-col items-center p-12 border-2 border-dashed border-slate-700 rounded-[2.5rem] group-hover:border-blue-500 transition-all bg-white/5 backdrop-blur-md shadow-xl">
                        <UploadIcon size={36} className="text-slate-500 group-hover:text-blue-500 mb-4 transition-transform group-hover:scale-110" />
                        <span className="font-black text-xs uppercase tracking-[0.3em] text-slate-400 group-hover:text-white text-center">Arquivo Local (.xlsx)</span>
                        <p className="text-[10px] text-slate-500 mt-3 italic max-w-xs text-center">Certifique-se de que o ficheiro possui abas correspondentes aos meses estruturadas corretamente.</p>
                        <input type="file" accept=".xlsx, .xls, .csv" className="hidden" onChange={handleFileUpload} />
                      </div>
                    </label>
                </div>
              </div>
            );
          }

          // Tela Principal do Dashboard
          return (
            <div className="min-h-screen p-4 md:p-10 font-sans bg-[#020617] text-white">
              <header className="mb-10 flex flex-col xl:flex-row justify-between items-start xl:items-center border-b border-white/10 pb-10 gap-6">
                <div>
                  <h1 className="text-3xl font-black uppercase tracking-tighter text-white italic">Análise de custos</h1>
                  <p className="text-[10px] font-black uppercase tracking-[0.4em] text-blue-400">Ferramenta de apoio estratégico ao controle de custos operacionais.</p>
                </div>

                <div className="flex flex-col sm:flex-row items-center gap-4 bg-slate-900/50 border border-white/10 p-3 rounded-2xl backdrop-blur-md w-full xl:w-auto">
                  <div className="flex items-center gap-2 w-full sm:w-64 border-b sm:border-b-0 sm:border-r border-white/10 pb-3 sm:pb-0 sm:pr-4 relative">
                    <div className="text-blue-400 text-[10px] font-black uppercase tracking-widest flex items-center gap-1">
                      <SearchIcon size={14} /> Cliente:
                    </div>
                    <div className="relative flex-1 flex items-center">
                        <input 
                          type="text"
                          placeholder="Buscar cliente..."
                          className="bg-transparent border-none outline-none font-black text-white text-sm w-full placeholder:text-slate-600 focus:ring-0"
                          value={selectedClient}
                          onChange={(e) => {
                              setSelectedClient(e.target.value);
                              setIsClientListOpen(true);
                          }}
                          onFocus={() => setIsClientListOpen(true)}
                          onBlur={() => setTimeout(() => setIsClientListOpen(false), 200)}
                        />
                        <button 
                          onClick={() => setIsClientListOpen(!isClientListOpen)}
                          className="text-slate-500 hover:text-white px-2 cursor-pointer z-10"
                          title="Ver lista de clientes"
                        >
                          <ChevronDown size={16} />
                        </button>
                        {selectedClient && (
                          <button 
                            onClick={() => { setSelectedClient(''); setIsClientListOpen(false); }} 
                            className="absolute right-8 text-slate-500 hover:text-white z-10"
                            title="Limpar filtro"
                          >
                            ✕
                          </button>
                        )}
                        
                        {isClientListOpen && (
                            <ul className="absolute top-full left-0 mt-4 w-full max-h-60 overflow-y-auto bg-slate-800 border border-slate-700 rounded-xl shadow-2xl z-50 custom-scrollbar py-2">
                                <li 
                                    className="px-4 py-2 hover:bg-blue-600/50 cursor-pointer text-xs font-bold text-slate-400 uppercase tracking-wider transition-colors"
                                    onClick={() => { setSelectedClient(''); setIsClientListOpen(false); }}
                                >
                                    Todos os Clientes
                                </li>
                                {clients.filter(c => c.toLowerCase().includes(selectedClient.toLowerCase())).map(c => (
                                    <li 
                                        key={c}
                                        className="px-4 py-3 hover:bg-blue-600 cursor-pointer text-sm font-bold text-white border-t border-slate-700/50 transition-colors"
                                        onClick={() => { setSelectedClient(c); setIsClientListOpen(false); }}
                                    >
                                        {c}
                                    </li>
                                ))}
                                {clients.filter(c => c.toLowerCase().includes(selectedClient.toLowerCase())).length === 0 && (
                                    <li className="px-4 py-3 text-sm font-bold text-slate-500 italic">
                                        Nenhum cliente encontrado.
                                    </li>
                                )}
                            </ul>
                        )}
                    </div>
                  </div>

                  <div className="flex items-center gap-2 w-full sm:w-auto">
                    <div className="text-emerald-400 text-[10px] font-black uppercase tracking-widest flex items-center gap-1">
                      <CalendarIcon size={14} /> Mês:
                    </div>
                    <select 
                      className="bg-transparent border-none outline-none font-black text-white cursor-pointer text-sm w-full"
                      value={selectedMonth}
                      onChange={(e) => setSelectedMonth(e.target.value)}
                    >
                      {availableMonths.map(m => <option key={m} value={m} className="bg-slate-900 text-white">{m}</option>)}
                    </select>
                  </div>
                </div>
              </header>

              <nav className="flex flex-wrap gap-3 mb-10 bg-white/5 p-2 rounded-2xl w-fit border border-white/5 backdrop-blur-md">
                <button onClick={() => setActiveTab('geral')} className={`flex items-center gap-2 px-8 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest transition-all ${activeTab === 'geral' ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/40' : 'text-slate-400 hover:text-white'}`}>
                  <LayoutDashboard size={14}/> Geral
                </button>
                <button onClick={() => setActiveTab('analises')} className={`flex items-center gap-2 px-8 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest transition-all ${activeTab === 'analises' ? 'bg-purple-600 text-white shadow-lg shadow-purple-500/40' : 'text-slate-400 hover:text-white'}`}>
                  <PieChartIcon size={14}/> Análises de Atendimentos
                </button>
                <button onClick={() => setActiveTab('inconsistencias')} className={`flex items-center gap-2 px-8 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest transition-all ${activeTab === 'inconsistencias' ? 'bg-red-600 text-white shadow-lg shadow-red-500/40' : 'text-slate-400 hover:text-white'}`}>
                  <AlertTriangle size={14}/> Críticos
                </button>
                <button onClick={() => setActiveTab('ranking')} className={`flex items-center gap-2 px-8 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest transition-all ${activeTab === 'ranking' ? 'bg-cyan-600 text-white shadow-lg shadow-cyan-500/40' : 'text-slate-400 hover:text-white'}`}>
                  <Award size={14}/> Ranking Rentabilidade
                </button>
                <button onClick={() => setActiveTab('faturamento')} className={`flex items-center gap-2 px-8 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest transition-all ${activeTab === 'faturamento' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-500/40' : 'text-slate-400 hover:text-white'}`}>
                  <BarChart3 size={14}/> Faturamento
                </button>
              </nav>

              <main>
                {activeTab === 'geral' && (
                  <div className="space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-700">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div className="bg-[#0f172a] p-8 rounded-[2rem] border border-white/5 border-l-8 border-l-slate-500 shadow-2xl">
                        <p className="text-[10px] font-black text-slate-500 uppercase mb-3 tracking-[0.2em] italic">Custo com prestadores</p>
                        <div className="text-5xl font-black text-slate-100">{formatBRL(stats.totalCusto)}</div>
                      </div>

                      <div className="bg-[#0f172a] p-8 rounded-[2rem] border border-white/5 border-l-8 border-l-blue-600 shadow-2xl">
                        <p className="text-[10px] font-black text-slate-500 uppercase mb-3 tracking-[0.2em] italic">Faturamento</p>
                        <div className="text-5xl font-black text-blue-500">{formatBRL(stats.totalFaturado)}</div>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div className="bg-[#0f172a] p-8 rounded-[2rem] border border-white/5 border-l-8 border-l-cyan-400 shadow-2xl">
                        <p className="text-[10px] font-black text-slate-500 uppercase mb-3 tracking-[0.2em] italic">Receita - 20% de imposto</p>
                        <div className="text-5xl font-black text-cyan-400">{formatBRL(stats.faturadoAjustado)}</div>
                      </div>

                      <div className="bg-[#0f172a] p-8 rounded-[2rem] border-2 border-emerald-500/20 border-l-8 border-l-emerald-500 shadow-2xl shadow-emerald-900/10">
                        <p className="text-[10px] font-black text-slate-500 uppercase mb-3 tracking-[0.2em] italic">Lucro Líquido Final</p>
                        <div className={`text-5xl font-black ${stats.totalLucro >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>
                          {formatBRL(stats.totalLucro)}
                        </div>
                      </div>
                    </div>

                    <div className="bg-[#0f172a] p-10 rounded-[2.5rem] border border-white/5 shadow-2xl">
                      <div className="flex justify-between items-center mb-12">
                        <div>
                          <h3 className="text-sm font-black uppercase tracking-[0.3em] text-white flex items-center gap-3">
                            <ClipboardList size={20} className="text-blue-500"/> Volume Operacional por Tipo
                          </h3>
                          <p className="text-[10px] font-bold text-slate-500 uppercase mt-2 tracking-widest">Contagem exata de ocorrências ({selectedMonth === 'Todos' ? 'Consolidado' : selectedMonth})</p>
                        </div>
                        <div className="text-right">
                          <span className="text-xl font-black text-blue-500 bg-blue-500/10 px-6 py-2 rounded-2xl uppercase tracking-tighter">
                            {stats.totalOS} Atendimentos
                          </span>
                        </div>
                      </div>
                      
                      <div className="h-[450px]">
                        <ResponsiveContainer width="100%" height="100%">
                          <BarChart data={serviceDistribution} layout="vertical" margin={{ left: 160, right: 60 }}>
                            <CartesianGrid strokeDasharray="3 3" stroke="#ffffff05" horizontal={false} />
                            <XAxis type="number" hide />
                            <YAxis dataKey="tipo" type="category" stroke="#f8fafc" fontSize={11} fontWeight="black" axisLine={false} tickLine={false} width={150} />
                            <Tooltip cursor={{ fill: '#ffffff05' }} contentStyle={{ backgroundColor: '#0f172a', border: '1px solid #1e293b', borderRadius: '16px' }} itemStyle={{ color: '#ffffff', fontSize: '12px', fontWeight: 'black', textTransform: 'uppercase' }} />
                            <Bar dataKey="qtd" name="Quantidade" fill="#0066ff" radius={[0, 12, 12, 0]} barSize={24}>
                              <LabelList dataKey="qtd" position="right" fill="#f8fafc" fontSize={12} fontWeight="black" offset={15} />
                              {serviceDistribution.map((entry, index) => (
                                <Cell key={`cell-${index}`} fill={index === 0 ? '#3b82f6' : '#1e293b'} />
                              ))}
                            </Bar>
                          </BarChart>
                        </ResponsiveContainer>
                      </div>
                    </div>

                    <div className="bg-[#0f172a] p-10 rounded-[2.5rem] border border-white/5 shadow-2xl mt-8">
                      <div className="flex justify-between items-center mb-12">
                        <div>
                          <h3 className="text-sm font-black uppercase tracking-[0.3em] text-white flex items-center gap-3">
                            <LineChartIcon size={20} className="text-purple-500"/> Evolução de Faturamento
                          </h3>
                          <p className="text-[10px] font-bold text-slate-500 uppercase mt-2 tracking-widest">Faturamento vs Volume de Atendimentos ao longo dos meses</p>
                        </div>
                      </div>

                      <div className="h-[500px] w-full">
                        {evolutionData.length > 0 ? (
                          <ResponsiveContainer width="100%" height="100%">
                            <ComposedChart data={evolutionData} margin={{ top: 20, right: 20, bottom: 20, left: 20 }}>
                              <CartesianGrid strokeDasharray="3 3" stroke="#ffffff05" vertical={false} />
                              <XAxis dataKey="mes" stroke="#94a3b8" fontSize={11} fontWeight="black" axisLine={false} tickLine={false} />
                              
                              <YAxis yAxisId="left" stroke="#10b981" fontSize={11} fontWeight="black" axisLine={false} tickLine={false} tickFormatter={(val) => new Intl.NumberFormat('pt-BR', { notation: "compact", compactDisplay: "short" }).format(val)} />
                              <YAxis yAxisId="right" orientation="right" stroke="#3b82f6" fontSize={11} fontWeight="black" axisLine={false} tickLine={false} />
                              
                              <Tooltip 
                                contentStyle={{ backgroundColor: '#0f172a', border: '1px solid #1e293b', borderRadius: '16px', boxShadow: '0 20px 40px rgba(0,0,0,0.5)' }}
                                itemStyle={{ color: '#ffffff', fontSize: '12px', fontWeight: 'black', textTransform: 'uppercase' }}
                                formatter={(value, name) => {
                                  if (name === "Volume O.S.") return [value, name];
                                  return [formatBRL(value), name];
                                }}
                              />
                              <Legend verticalAlign="top" height={40} />
                              
                              <Bar yAxisId="left" dataKey="faturado" name="Faturamento Bruto" fill="#10b981" radius={[6, 6, 0, 0]} barSize={40} />
                              <Line yAxisId="right" type="monotone" dataKey="osCount" name="Volume O.S." stroke="#3b82f6" strokeWidth={4} dot={{ r: 6, fill: '#3b82f6' }} activeDot={{ r: 8 }} />
                            </ComposedChart>
                          </ResponsiveContainer>
                        ) : (
                          <div className="flex h-full items-center justify-center flex-col text-slate-500">
                             <AlertTriangle size={48} className="mb-4 text-slate-600" />
                             <p className="font-bold uppercase tracking-widest text-sm">Dados insuficientes</p>
                             <p className="text-xs italic mt-2">Nenhum registo encontrado para os filtros atuais.</p>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'analises' && analisesStats && (
                  <div className="space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-700">
                    <div className="bg-purple-500/5 border border-purple-500/10 p-8 rounded-[2rem] flex items-center justify-between shadow-lg">
                      <div>
                        <h3 className="text-purple-400 font-black text-sm uppercase flex items-center gap-3 tracking-[0.3em]">
                          <PieChartIcon size={24} /> Análises de Performance
                        </h3>
                        <p className="text-slate-400 text-xs mt-2 font-bold uppercase italic">Métricas baseadas na aba geral de Atendimentos filtradas por {selectedMonth}. (Total: {analisesStats.total} O.S. analisadas)</p>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                      
                      <div className="bg-[#0f172a] p-8 rounded-[2rem] border border-white/5 shadow-2xl">
                          <h4 className="text-sm font-black uppercase text-white tracking-[0.2em] mb-1">Apoios Mais Acionados</h4>
                          <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-6">Volume total vs Efetividade (% Recuperação)</p>
                          
                          <div className="h-[400px]">
                              <ResponsiveContainer width="100%" height="100%">
                                  <ComposedChart data={analisesStats.rankingApoios} layout="vertical" margin={{ left: 80, right: 40 }}>
                                      <CartesianGrid strokeDasharray="3 3" stroke="#ffffff05" horizontal={false} />
                                      <XAxis type="number" hide />
                                      <YAxis dataKey="nome" type="category" stroke="#94a3b8" fontSize={10} fontWeight="black" axisLine={false} tickLine={false} width={100} />
                                      <Tooltip 
                                          contentStyle={{ backgroundColor: '#0f172a', border: '1px solid #1e293b', borderRadius: '12px' }}
                                          itemStyle={{ color: '#fff', fontSize: '12px', fontWeight: 'bold' }}
                                          formatter={(value, name) => name === 'taxaSucesso' ? [`${value.toFixed(1)}%`, 'Taxa de Recuperação'] : [value, 'Total O.S.']}
                                      />
                                      <Bar dataKey="total" fill="#3b82f6" radius={[0, 4, 4, 0]} barSize={16}>
                                          <LabelList dataKey="total" position="right" fill="#94a3b8" fontSize={10} fontWeight="bold" />
                                      </Bar>
                                      <Line dataKey="taxaSucesso" name="Taxa de Recuperação" type="monotone" stroke="#10b981" strokeWidth={3} dot={{ r: 4, fill: '#10b981' }}>
                                          <LabelList dataKey="taxaSucesso" position="top" fill="#10b981" fontSize={10} fontWeight="bold" formatter={(val) => `${val.toFixed(0)}%`} />
                                      </Line>
                                  </ComposedChart>
                              </ResponsiveContainer>
                          </div>
                      </div>

                      <div className="flex flex-col gap-6">
                        <div className="bg-[#0f172a] p-8 rounded-[2rem] border border-white/5 shadow-2xl flex-1 flex flex-col">
                            <h4 className="text-sm font-black uppercase text-white tracking-[0.2em] mb-1">Índice de Recuperação</h4>
                            <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-2">Recuperado vs Não recuperado ({selectedMonth})</p>
                            <div className="flex-1 flex items-center justify-center h-[200px]">
                                <ResponsiveContainer width="100%" height="100%">
                                    <PieChart>
                                        <Pie 
                                            data={analisesStats.statusData} 
                                            cx="50%" cy="50%" 
                                            innerRadius={60} outerRadius={90} 
                                            paddingAngle={2} dataKey="value" stroke="none"
                                            labelLine={false}
                                            label={({ cx, cy, midAngle, innerRadius, outerRadius, percent }) => {
                                                const radius = innerRadius + (outerRadius - innerRadius) * 0.5;
                                                const x = cx + radius * Math.cos(-midAngle * Math.PI / 180);
                                                const y = cy + radius * Math.sin(-midAngle * Math.PI / 180);
                                                return percent > 0 ? (
                                                    <text x={x} y={y} fill="white" textAnchor="middle" dominantBaseline="central" fontSize={10} fontWeight="bold">
                                                        {`${(percent * 100).toFixed(0)}%`}
                                                    </text>
                                                ) : null;
                                            }}
                                        >
                                            {analisesStats.statusData.map((entry, index) => (
                                                <Cell key={`cell-${index}`} fill={entry.color} />
                                            ))}
                                        </Pie>
                                        <Tooltip 
                                            contentStyle={{ backgroundColor: '#0f172a', border: 'none', borderRadius: '12px', boxShadow: '0 10px 25px rgba(0,0,0,0.5)' }}
                                            itemStyle={{ color: '#fff', fontWeight: 'bold' }}
                                        />
                                        <Legend layout="vertical" verticalAlign="middle" align="right" wrapperStyle={{ fontSize: '10px', fontWeight: 'bold', textTransform: 'uppercase', color: '#94a3b8' }} />
                                    </PieChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                        <div className="bg-[#0f172a] p-8 rounded-[2rem] border border-white/5 shadow-2xl flex-1">
                            <h4 className="text-sm font-black uppercase text-white tracking-[0.2em] mb-1">Densidade Geográfica vs Indice de recuperação</h4>
                            <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-6">Volume de O.S. (Barra) e Taxa de Recuperação (Linha)</p>
                            <div className="h-[200px]">
                                <ResponsiveContainer width="100%" height="100%">
                                    <ComposedChart data={analisesStats.regiaoData} margin={{ top: 20, right: 10, left: -20, bottom: 0 }}>
                                        <CartesianGrid strokeDasharray="3 3" stroke="#ffffff05" vertical={false} />
                                        <XAxis dataKey="regiao" stroke="#64748b" fontSize={10} fontWeight="bold" axisLine={false} tickLine={false} />
                                        <YAxis yAxisId="left" stroke="#64748b" fontSize={10} fontWeight="bold" axisLine={false} tickLine={false} />
                                        <YAxis yAxisId="right" orientation="right" hide />
                                        <Tooltip 
                                            cursor={{fill: '#ffffff05'}}
                                            contentStyle={{ backgroundColor: '#0f172a', border: '1px solid #1e293b', borderRadius: '12px' }}
                                            itemStyle={{ color: '#f59e0b', fontWeight: 'bold' }}

                                                .map(([name, value]) => ({ name, value }))

                                        <th className="p-4 font-black uppercase text-center">Variação</th>
                                        <th className="p-4 font-black uppercase text-right">Acionamentos Totais</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-white/5">
                                    {clientActivity.list.length > 0 ? clientActivity.list.map((item, idx) => {
                                        const variacao = item.mesAtual - item.mesAnterior;
                                        const diasAlerta = typeof item.diasSemAcionar === 'number' && item.diasSemAcionar >= 30;
                                        
                                        return (
                                            <tr key={idx} className="hover:bg-white/5">
                                                <td className="p-4 font-bold text-white uppercase">{item.cliente}</td>
                                                <td className="p-4 text-center text-slate-300 font-medium">{item.dataUltimoAcionamento}</td>
                                                <td className="p-4 text-center">
                                                    <span className={`px-2 py-1 rounded-md font-bold ${diasAlerta ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'text-slate-400'}`}>
                                                        {item.diasSemAcionar !== "N/D" ? `${item.diasSemAcionar} dias` : item.diasSemAcionar}
                                                    </span>
                                                </td>
                                                <td className="p-4 text-center text-slate-400">{item.mesAnterior}</td>
                                                <td className="p-4 text-center text-white font-bold">{item.mesAtual}</td>
                                                <td className="p-4 text-center">
                                                    {variacao > 0 ? (
                                                        <span className="text-emerald-400 font-bold bg-emerald-400/10 px-2 py-1 rounded-md">+{variacao} ▲</span>
                                                    ) : variacao < 0 ? (
                                                        <span className="text-red-400 font-bold bg-red-400/10 px-2 py-1 rounded-md">{variacao} ▼</span>
                                                    ) : (
                                                        <span className="text-slate-500 font-bold">0 =</span>
                                                    )}
                                                </td>
                                                <td className="p-4 text-right font-black text-blue-400 text-sm">{item.total}</td>
                                            </tr>
                                        );
                                    }) : (
                                        <tr>
                                            <td colSpan="7" className="p-8 text-center text-slate-500 font-bold italic text-xs uppercase tracking-widest">
                                                Nenhum dado compatível extraído da aba de atendimentos. Verifique as colunas de "Cliente" e "Data".
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                        )}
                    </div>
                  </div>
                )}
              </main>

              <footer className="mt-20 pt-10 border-t border-white/10 flex flex-col md:flex-row justify-end items-center gap-8 pb-12">
                <div className="text-center md:text-right">
                  <p className="text-lg font-black text-white uppercase tracking-tight italic">Claris Bolorini</p>
                  <p className="text-[10px] font-bold uppercase tracking-[0.3em] text-blue-400 border-t border-blue-500/30 pt-2 mt-2">
                    Gestão da informação de Faturamento
                  </p>
                </div>
              </footer>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
