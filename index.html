                          <div className="bg-[#0f172a] p-6 rounded-[2rem] border border-white/5 border-l-8 border-l-amber-500 shadow-2xl">
                            <p className="text-[10px] font-black text-slate-500 uppercase mb-2 tracking-[0.2em] italic">Lucro Líquido Real (com 20% de imposto descontado)</p>
                            <div className={`text-3xl font-black ${reboqueStats.lucroLiquidoTotal >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>
                              {formatBRL(reboqueStats.lucroLiquidoTotal)}
                            </div>
                            <p className="text-[9px] text-slate-400 mt-2 font-bold uppercase">Margem Real: {formatPercent(reboqueStats.margemMedia)}</p>
                          </div>

                          <div className={`bg-[#0f172a] p-6 rounded-[2rem] border shadow-2xl border-l-8 ${reboqueStats.reboquesCriticosCount > 0 ? 'border-red-500/20 border-l-red-500 shadow-red-950/5' : 'border-white/5 border-l-emerald-500'}`}>
                            <p className="text-[10px] font-black text-slate-500 uppercase mb-2 tracking-[0.2em] italic">Reboques Críticos</p>
                            <div className={`text-3xl font-black ${reboqueStats.reboquesCriticosCount > 0 ? 'text-red-500 animate-pulse' : 'text-emerald-500'}`}>
                              {reboqueStats.reboquesCriticosCount}
                            </div>
                            <p className="text-[9px] text-slate-400 mt-2 font-bold uppercase">Sem cobrança ou lucro &lt; 16%</p>
                          </div>
                        </div>

                        {/* Navegação Secundária para Filtros de Reboque */}
                        <div className="flex justify-start">
                          <nav className="flex flex-wrap gap-2 bg-slate-900 p-1.5 rounded-2xl border border-white/5 w-fit">
                            <button 
                              onClick={() => setReboqueSubTab('geral')}
                              className={`px-6 py-2.5 rounded-xl font-black text-[9px] uppercase tracking-wider transition-all ${reboqueSubTab === 'geral' ? 'bg-amber-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                            >
                              Visão Geral
                            </button>
                            <button 
                              onClick={() => setReboqueSubTab('criticos')}
                              className={`px-6 py-2.5 rounded-xl font-black text-[9px] uppercase tracking-wider transition-all ${reboqueSubTab === 'criticos' ? 'bg-red-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                            >
                              Prejuízos / Críticos ({reboqueStats.reboquesCriticosCount})
                            </button>
                            <button 
                              onClick={() => setReboqueSubTab('regiao')}
                              className={`px-6 py-2.5 rounded-xl font-black text-[9px] uppercase tracking-wider transition-all ${reboqueSubTab === 'regiao' ? 'bg-cyan-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                            >
                              Reboques por Região
                            </button>
                            <button 
                              onClick={() => setReboqueSubTab('guincheiros')}
                              className={`px-6 py-2.5 rounded-xl font-black text-[9px] uppercase tracking-wider transition-all ${reboqueSubTab === 'guincheiros' ? 'bg-purple-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                            >
                              Ranking de Guincheiros
                            </button>
                          </nav>
                        </div>

                        {/* Render de Subtabs */}
                        {reboqueSubTab === 'geral' && (
                          <div className="bg-[#0f172a] p-8 rounded-[2.5rem] border border-white/5 shadow-2xl animate-in fade-in duration-300">
                            <h4 className="text-sm font-black uppercase text-white tracking-[0.2em] mb-2">
                              {selectedMonth === 'Todos' ? 'Evolução Mensal de Reboques' : `Maiores Clientes em Reboques - ${selectedMonth}`}
                            </h4>
                            <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-6">
                              {selectedMonth === 'Todos' ? 'Comparativo de faturamento bruto vs custo com guincheiros' : 'Top 10 clientes com maior volume financeiro de reboques'}
                            </p>
                            <div className="h-[400px]">
                              {reboqueByMonth.length > 0 ? (
                                <ResponsiveContainer width="100%" height="100%">
                                  <ComposedChart data={selectedMonth === 'Todos' ? reboqueByMonth : reboqueByClient} margin={{ top: 20, right: 20, bottom: 20, left: 20 }}>
                                    <CartesianGrid strokeDasharray="3 3" stroke="#ffffff05" vertical={false} />
                                    <XAxis dataKey={selectedMonth === 'Todos' ? 'mes' : 'cliente'} stroke="#94a3b8" fontSize={11} fontWeight="black" axisLine={false} tickLine={false} />
                                    <YAxis stroke="#94a3b8" fontSize={11} fontWeight="black" axisLine={false} tickLine={false} tickFormatter={(val) => new Intl.NumberFormat('pt-BR', { notation: "compact", compactDisplay: "short" }).format(val)} />
                                    <Tooltip 
                                      contentStyle={{ backgroundColor: '#0f172a', border: '1px solid #1e293b', borderRadius: '16px' }}
                                      itemStyle={{ color: '#ffffff', fontSize: '12px', fontWeight: 'black', textTransform: 'uppercase' }}
                                      formatter={(value, name) => [formatBRL(value), name]}
                                    />
                                    <Legend verticalAlign="top" height={40} />
                                    <Bar dataKey="faturado" name="Faturamento" fill="#3b82f6" radius={[6, 6, 0, 0]} barSize={32} />
                                    <Bar dataKey="custo" name="Custo Guincheiro" fill="#ef4444" radius={[6, 6, 0, 0]} barSize={32} />
                                    <Line type="monotone" dataKey="lucro" name="Lucro Líquido" stroke="#10b981" strokeWidth={3} dot={{ r: 5 }} />
                                  </ComposedChart>
                                </ResponsiveContainer>
                              ) : (
                                <div className="flex h-full items-center justify-center flex-col text-slate-500">
                                   <AlertTriangle size={48} className="mb-4 text-slate-600" />
                                   <p className="font-bold uppercase tracking-widest text-sm">Dados insuficientes</p>
                                   <p className="text-xs italic mt-2">Gere o upload da planilha com a aba "REBOQUE" para preencher este gráfico.</p>
                                </div>
                              )}
                            </div>
                          </div>
                        )}

                        {reboqueSubTab === 'criticos' && (
                          <div className="space-y-6 animate-in fade-in duration-300">
                            <div className="bg-red-500/10 border border-red-500/20 p-6 rounded-2xl flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                              <div>
                                <h4 className="text-red-500 font-black text-sm uppercase flex items-center gap-2">
                                  <AlertTriangle size={18} /> Auditoria de Operações Críticas
                                </h4>
                                <p className="text-slate-400 text-xs mt-1">
                                  Listagem de reboques onde a RNS perde dinheiro (sem faturamento ou lucro líquido abaixo de 16% do faturamento cobrado).
                                </p>
                              </div>
                              <div className="relative w-full md:w-80">
                                <span className="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500 pointer-events-none">
                                  <SearchIcon size={14} />
                                </span>
                                <input
                                  type="text"
                                  placeholder="Filtrar por cliente, placa ou guincheiro..."
                                  className="w-full pl-9 pr-4 py-2 text-xs bg-black/40 border border-slate-700 rounded-xl text-white placeholder:text-slate-600 focus:outline-none focus:border-red-500 transition-colors"
                                  value={criticalSearch}
                                  onChange={(e) => setCriticalSearch(e.target.value)}
                                />
                              </div>
                            </div>

                            <div className="bg-white/[0.02] border border-white/5 rounded-[2rem] overflow-hidden shadow-2xl">
                              <div className="overflow-y-auto max-h-[500px] custom-scrollbar">
                                <table className="w-full text-left text-[11px]">
                                  <thead className="sticky top-0 bg-[#0f172a] z-10 border-b border-white/10 shadow-md">
                                    <tr className="text-slate-500">
                                      <th className="p-4 font-black uppercase tracking-wider">Data</th>
                                      <th className="p-4 font-black uppercase tracking-wider">Placa</th>
                                      <th className="p-4 font-black uppercase tracking-wider">Cliente</th>
                                      <th className="p-4 font-black uppercase tracking-wider">Guincheiro</th>
                                      <th className="p-4 font-black uppercase tracking-wider">Região (UF)</th>
                                      <th className="p-4 font-black uppercase tracking-wider text-right">Pago (Prestador)</th>
                                      <th className="p-4 font-black uppercase tracking-wider text-right">Cobrado (Cliente)</th>
                                      <th className="p-4 font-black uppercase tracking-wider text-right">Lucro Líquido</th>
                                      <th className="p-4 font-black uppercase tracking-wider text-center">Status de Alerta</th>
                                    </tr>
                                  </thead>
                                  <tbody className="divide-y divide-white/5">
                                    {(() => {
                                      const list = filteredReboqueData.filter(d => d.isPrejuizoOuCritico);
                                      const filteredList = list.filter(item => {
                                        const s = criticalSearch.toLowerCase();
                                        return item.cliente.toLowerCase().includes(s) ||
                                               item.guincheiro.toLowerCase().includes(s) ||
                                               item.placa.toLowerCase().includes(s) ||
                                               item.estado.toLowerCase().includes(s);
                                      });

                                      if (filteredList.length === 0) {
                                        return (
                                          <tr>
                                            <td colSpan="9" className="p-8 text-center text-slate-500 italic">
                                              Nenhum reboque crítico encontrado para os filtros atuais.
                                            </td>
                                          </tr>
                                        );
                                      }

                                      return filteredList.map((item, idx) => {
                                        const isNoCharge = item.valorCliente === 0;
                                        return (
                                          <tr key={idx} className="hover:bg-white/5 transition-colors">
                                            <td className="p-4 text-slate-400 font-medium whitespace-nowrap">{item.dataStr ? item.dataStr.substring(0, 10) : 'N/D'}</td>
                                            <td className="p-4 font-black text-amber-500 font-mono text-xs">{item.placa || 'N/A'}</td>
                                            <td className="p-4 font-bold uppercase text-slate-200">{item.cliente}</td>
                                            <td className="p-4 text-slate-300 font-medium">{item.guincheiro}</td>
                                            <td className="p-4 font-bold text-center text-slate-400">{item.estado}</td>
                                            <td className="p-4 text-right font-bold text-slate-300">{formatBRL(item.valorGuincheiro)}</td>
                                            <td className="p-4 text-right font-black text-blue-400">{formatBRL(item.valorCliente)}</td>
                                            <td className={`p-4 text-right font-black ${item.lucroLiquido >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>
                                              {formatBRL(item.lucroLiquido)}
                                            </td>
                                            <td className="p-4 text-center">
                                              <span className={`px-2.5 py-1 rounded-full text-[9px] font-black uppercase tracking-wider ${isNoCharge ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}`}>
                                                {isNoCharge ? 'Não Cobrado' : `Margem Baixa (${formatPercent(item.margemLucro)})`}
                                              </span>
                                            </td>
                                          </tr>
                                        );
                                      });
                                    })()}
                                  </tbody>
                                </table>
                              </div>
                            </div>
                          </div>
                        )}

                        {reboqueSubTab === 'regiao' && (
                          <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 animate-in fade-in duration-300">
                            {/* Gráfico Geográfico Alimentado por Atendimentos de Reboque */}
                            <div className="bg-[#0f172a] p-8 rounded-[2rem] border border-white/5 shadow-2xl">
                              <h4 className="text-sm font-black uppercase text-white tracking-[0.2em] mb-2">Demandas de Reboque por Estado (UF)</h4>
                              <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-6">Volume total baseado na aba granular "Atendimentos de reboque"</p>
                              <div className="h-[350px]">
                                {reboqueByRegion.length > 0 ? (
                                  <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={reboqueByRegion} layout="vertical" margin={{ left: 50, right: 30 }}>
                                      <CartesianGrid strokeDasharray="3 3" stroke="#ffffff05" horizontal={false} />
                                      <XAxis type="number" hide />
                                      <YAxis dataKey="estado" type="category" stroke="#94a3b8" fontSize={11} fontWeight="black" axisLine={false} tickLine={false} />
                                      <Tooltip cursor={{ fill: '#ffffff05' }} contentStyle={{ backgroundColor: '#0f172a', border: '1px solid #1e293b', borderRadius: '12px' }} />
                                      <Bar dataKey="total" name="Atendimentos" fill="#3b82f6" radius={[0, 8, 8, 0]} barSize={16}>
                                        <LabelList dataKey="total" position="right" fill="#f8fafc" fontSize={11} fontWeight="black" offset={10} />
                                        {reboqueByRegion.map((entry, index) => (
                                          <Cell key={`cell-${index}`} fill={index === 0 ? '#d97706' : index === 1 ? '#0284c7' : '#1e293b'} />
                                        ))}
                                      </Bar>
                                    </BarChart>
                                  </ResponsiveContainer>
                                ) : (
                                  <div className="flex h-full items-center justify-center text-slate-500">Nenhum dado geográfico.</div>
                                )}
                              </div>
                            </div>

                            <div className="bg-[#0f172a] p-8 rounded-[2rem] border border-white/5 shadow-2xl flex flex-col justify-between">
                              <div>
                                <h4 className="text-sm font-black uppercase text-white tracking-[0.2em] mb-2">Financeiro Consolidado por Estado</h4>
                                <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-4">Mapeamento de custos, faturamento bruto e lucro real líquido por estado</p>
                              </div>
                              <div className="overflow-y-auto max-h-[300px] custom-scrollbar flex-1">
                                <table className="w-full text-left text-[11px]">
                                  <thead>
                                    <tr className="border-b border-white/10 text-slate-500">
                                      <th className="p-3 font-black uppercase">UF</th>
                                      <th className="p-3 font-black uppercase text-center">Atendimentos</th>
                                      <th className="p-3 font-black uppercase text-right">Pago</th>
                                      <th className="p-3 font-black uppercase text-right">Cobrado</th>
                                      <th className="p-3 font-black uppercase text-right">Lucro Real</th>
                                    </tr>
                                  </thead>
                                  <tbody className="divide-y divide-white/5">
                                    {reboqueByRegion.map((r, idx) => {
                                      const margem = r.faturado > 0 ? (r.lucro / r.faturado) : 0;
                                      return (
                                        <tr key={`${r.estado}-${idx}`} className="hover:bg-white/5">
                                          <td className="p-3 font-black text-white">{r.estado}</td>
                                          <td className="p-3 text-center font-bold text-amber-500">{r.total}</td>
                                          <td className="p-3 text-right text-slate-400">{formatBRL(r.custo)}</td>
                                          <td className="p-3 text-right text-blue-400 font-bold">{formatBRL(r.faturado)}</td>
                                          <td className={`p-3 text-right font-black ${r.lucro >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>
                                            {formatBRL(r.lucro)}
                                            <span className="block text-[9px] text-slate-500 font-medium">Margem: {formatPercent(margem)}</span>
                                          </td>
                                        </tr>
                                      );
                                    })}
                                  </tbody>
                                </table>
                              </div>
                            </div>
                          </div>
                        )}

                        {reboqueSubTab === 'guincheiros' && (
                          <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 animate-in fade-in duration-300">
                            {/* Gráfico de Guincheiros mais chamados por volume baseado na aba granular de Atendimentos */}
                            <div className="bg-[#0f172a] p-8 rounded-[2rem] border border-white/5 shadow-2xl">
                              <h4 className="text-sm font-black uppercase text-white tracking-[0.2em] mb-2">Guincheiros mais Chamados</h4>
                              <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-6">Guincheiros com maior volumetria real na base "Atendimentos de reboque" (Top 10)</p>
                              <div className="h-[350px]">
                                {reboqueByGuincheiro.length > 0 ? (
                                  <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={[...reboqueByGuincheiro].sort((a,b) => b.total - a.total).slice(0, 10)} layout="vertical" margin={{ left: 120, right: 30 }}>
                                      <CartesianGrid strokeDasharray="3 3" stroke="#ffffff05" horizontal={false} />
                                      <XAxis type="number" hide />
                                      <YAxis dataKey="guincheiro" type="category" stroke="#94a3b8" fontSize={10} fontWeight="black" axisLine={false} tickLine={false} width={110} />
                                      <Tooltip cursor={{ fill: '#ffffff05' }} contentStyle={{ backgroundColor: '#0f172a', border: '1px solid #1e293b', borderRadius: '12px' }} />
                                      <Bar dataKey="total" name="Chamados" fill="#8b5cf6" radius={[0, 8, 8, 0]} barSize={14}>
                                        <LabelList dataKey="total" position="right" fill="#f8fafc" fontSize={10} fontWeight="black" offset={8} />
                                        {reboqueByGuincheiro.slice(0, 10).map((entry, index) => (
                                          <Cell key={`cell-${index}`} fill={index === 0 ? '#8b5cf6' : index === 1 ? '#a78bfa' : '#1e293b'} />
                                        ))}
                                      </Bar>
                                    </BarChart>
                                  </ResponsiveContainer>
                                ) : (
                                  <div className="flex h-full items-center justify-center text-slate-500">Nenhum guincheiro.</div>
                                )}
                              </div>
                            </div>

                            {/* Tabela de performance de guincheiros - LISTA COMPLETA DE GUINCHEIROS ORDENADA POR RENTABILIDADE E COM CHAMADOS DA ABA GRANULAR */}
                            <div className="bg-[#0f172a] p-8 rounded-[2rem] border border-white/5 shadow-2xl flex flex-col justify-between">
                              <div>
                                <h4 className="text-sm font-black uppercase text-white tracking-[0.2em] mb-2">Dependência e Performance por Guincheiro</h4>
                                <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-4">Lista Completa ordenada por Rentabilidade. Volume de chamados extraído de "Atendimentos de reboque".</p>
                              </div>
                              <div className="overflow-y-auto max-h-[450px] custom-scrollbar flex-1">
                                <table className="w-full text-left text-[11px]">
                                  <thead>
                                    <tr className="border-b border-white/10 text-slate-500 bg-[#0f172a] sticky top-0 z-10 shadow-sm">
                                      <th className="p-3 font-black uppercase">Guincheiro</th>
                                      <th className="p-3 font-black uppercase text-center text-amber-500">Chamados</th>
                                      <th className="p-3 font-black uppercase text-right">Pago</th>
                                      <th className="p-3 font-black uppercase text-right">Cobrado</th>
                                      <th className="p-3 font-black uppercase text-right text-emerald-400">Rentabilidade</th>
                                      <th className="p-3 font-black uppercase text-right">Lucro Real</th>
                                    </tr>
                                  </thead>
                                  <tbody className="divide-y divide-white/5">
                                    {reboqueByGuincheiro.length > 0 ? (
                                      reboqueByGuincheiro.map((g, idx) => {
                                        const rentavel = g.rentabilidade >= CRITICAL_MARGIN_THRESHOLD;
                                        return (
                                          <tr key={`${g.guincheiro}-${idx}`} className="hover:bg-white/5 transition-colors">
                                            <td className="p-3 font-black text-white truncate max-w-[130px]" title={g.guincheiro}>{g.guincheiro}</td>
                                            <td className="p-3 text-center font-bold text-amber-500">{g.total}</td>
                                            <td className="p-3 text-right text-slate-400">{formatBRL(g.custo)}</td>
                                            <td className="p-3 text-right text-blue-400 font-bold">{formatBRL(g.faturado)}</td>
                                            <td className={`p-3 text-right font-black ${rentavel ? 'text-emerald-500' : 'text-red-500 bg-red-500/5'}`}>
                                              {formatPercent(g.rentabilidade)}
                                            </td>
                                            <td className={`p-3 text-right font-black ${g.lucro >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>
                                              {formatBRL(g.lucro)}
                                            </td>
                                          </tr>
                                        );
                                      })
                                    ) : (
                                      <tr>
                                        <td colSpan="6" className="p-8 text-center text-slate-500 italic">
                                          Carregue os dados da aba REBOQUE para listar os guincheiros.
                                        </td>
                                      </tr>
                                    )}
                                  </tbody>
                                </table>
                              </div>
                            </div>
                          </div>
                        )}
                      </>
                    )}
                  </div>
                )}
              </main>

              <footer className="mt-20 pt-10 border-t border-white/10 flex flex-col md:flex-row justify-end items-center gap-8 pb-12">
                <div className="text-center md:text-right">
                  <p className="text-lg font-black text-white uppercase tracking-tight italic">Claris Bolorini</p>
                  <p className="text-[10px] font-bold uppercase tracking-[0.3em] text-blue-400 border-t border-blue-500/30 pt-2 mt-2">
                    Gestão da informação de Faturamento
                  </p>
                </div>
              </footer>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
